<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PochoJii AI</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

:root{
    --pista:#b8c9a3;
    --pista-dark:#71815f;
    --cream:#f8f4e8;
    --nude:#eadfca;
    --yellow:#f4e7a1;
    --yellow-dark:#d7c66f;
    --text:#293128;
    --muted:#697264;
    --white:#fffdf7;
    --border:#d9d6c7;
    --shadow:0 10px 35px rgba(70,75,55,.10);
    --user:#dce8ca;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:var(--cream);
    color:var(--text);

    min-height:100vh;
}

button,
input,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

/* =========================
   APP
========================= */

.app{
    display:flex;
    min-height:100vh;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:270px;
    background:#eef1df;
    border-right:1px solid var(--border);

    display:flex;
    flex-direction:column;

    position:fixed;
    left:0;
    top:0;
    bottom:0;

    z-index:50;

    transition:.3s ease;
}

.logo-area{
    padding:24px 20px 18px;
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:46px;
    height:46px;

    border-radius:15px;

    background:var(--pista-dark);
    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:22px;
    font-weight:800;

    box-shadow:0 6px 18px rgba(90,105,75,.2);
}

.logo-text h1{
    font-size:19px;
    letter-spacing:-.4px;
}

.logo-text p{
    color:var(--muted);
    font-size:11px;
    margin-top:2px;
}

.new-chat{
    margin:5px 15px 15px;

    border:none;
    background:var(--pista-dark);
    color:white;

    padding:13px 15px;
    border-radius:13px;

    font-weight:700;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;

    transition:.2s;
}

.new-chat:hover{
    transform:translateY(-1px);
    filter:brightness(.96);
}

.search-box{
    margin:0 15px 12px;
    position:relative;
}

.search-box svg{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    color:var(--muted);
}

.search-box input{
    width:100%;
    border:1px solid var(--border);
    background:#f8f8ed;

    padding:10px 12px 10px 38px;

    border-radius:12px;
    outline:none;
}

.history{
    flex:1;
    overflow-y:auto;
    padding:4px 10px 15px;
}

.history-title{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--muted);
    padding:8px 8px;
}

.history-item{
    width:100%;
    border:none;
    background:transparent;

    text-align:left;

    padding:11px 10px;
    border-radius:11px;

    color:var(--text);

    margin-bottom:3px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.history-item:hover{
    background:#e1e7cf;
}

.sidebar-bottom{
    padding:12px;
    border-top:1px solid var(--border);
}

.theme-btn{
    width:100%;
    border:none;
    background:transparent;

    display:flex;
    align-items:center;
    gap:10px;

    padding:11px;
    border-radius:11px;

    color:var(--text);
}

.theme-btn:hover{
    background:#e1e7cf;
}

/* =========================
   MAIN
========================= */

.main{
    margin-left:270px;
    width:calc(100% - 270px);
    min-height:100vh;

    display:flex;
    flex-direction:column;
}

.topbar{
    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 25px;

    border-bottom:1px solid var(--border);

    background:rgba(248,244,232,.88);

    backdrop-filter:blur(15px);

    position:sticky;
    top:0;
    z-index:20;
}

.topbar-title{
    font-size:14px;
    font-weight:700;
}

.menu-btn{
    display:none;
    border:none;
    background:transparent;
}

.top-actions{
    display:flex;
    gap:7px;
}

.icon-btn{
    width:38px;
    height:38px;

    border:1px solid var(--border);
    background:var(--white);

    border-radius:11px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:var(--text);

    transition:.2s;
}

.icon-btn:hover{
    background:var(--yellow);
}

/* =========================
   CHAT
========================= */

.chat{
    flex:1;

    width:100%;
    max-width:980px;

    margin:0 auto;

    padding:45px 25px 150px;
}

.welcome{
    max-width:720px;
    margin:65px auto 40px;

    text-align:center;
}

.welcome-logo{
    width:72px;
    height:72px;

    border-radius:24px;

    background:var(--pista-dark);
    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:32px;
    font-weight:800;

    margin:0 auto 20px;

    box-shadow:0 15px 35px rgba(90,105,75,.18);
}

.welcome h2{
    font-size:36px;
    letter-spacing:-1.4px;
    margin-bottom:8px;
}

.welcome p{
    color:var(--muted);
    font-size:15px;
}

.tool-grid{
    margin-top:32px;

    display:grid;
    grid-template-columns:repeat(2,1fr);

    gap:12px;
}

.tool-card{
    border:1px solid var(--border);

    background:var(--white);

    border-radius:17px;

    padding:18px;

    text-align:left;

    transition:.2s;

    box-shadow:0 5px 20px rgba(60,65,45,.04);
}

.tool-card:hover{
    transform:translateY(-2px);
    box-shadow:var(--shadow);
    border-color:#bfc8a8;
}

.tool-card-title{
    font-weight:750;
    margin-bottom:5px;
}

.tool-card-description{
    font-size:12px;
    color:var(--muted);
}

/* =========================
   MESSAGES
========================= */

.message{
    display:flex;
    margin:25px 0;
}

.message.user{
    justify-content:flex-end;
}

.message-inner{
    max-width:82%;
}

.message.user .message-inner{
    max-width:75%;
}

.bubble{
    padding:15px 17px;

    border-radius:18px;

    line-height:1.65;

    font-size:15px;

    white-space:pre-wrap;
}

.user .bubble{
    background:var(--user);
    border-bottom-right-radius:5px;
}

.assistant .bubble{
    background:var(--white);
    border:1px solid var(--border);
    border-bottom-left-radius:5px;
}

.message-actions{
    display:flex;
    gap:5px;
    margin-top:7px;
}

.small-action{
    border:1px solid var(--border);
    background:transparent;

    border-radius:8px;

    padding:6px 9px;

    font-size:11px;
    color:var(--muted);
}

.small-action:hover{
    background:var(--yellow);
    color:var(--text);
}

/* =========================
   CODE
========================= */

pre{
    margin:14px 0;

    background:#252b25;
    color:#edf3e8;

    padding:15px;

    border-radius:12px;

    overflow-x:auto;

    font-size:13px;
}

code{
    font-family:
        "JetBrains Mono",
        "SFMono-Regular",
        Consolas,
        monospace;
}

/* =========================
   IMAGE
========================= */

.generated-image{
    width:100%;
    max-width:650px;

    border-radius:18px;

    border:1px solid var(--border);

    display:block;

    margin-bottom:10px;
}

.download-image{
    display:inline-flex;
    align-items:center;
    gap:7px;

    text-decoration:none;

    background:var(--pista-dark);
    color:white;

    padding:9px 13px;

    border-radius:10px;

    font-size:12px;
    font-weight:700;
}

/* =========================
   TYPING
========================= */

.typing{
    display:flex;
    gap:5px;
    padding:5px 2px;
}

.dot{
    width:7px;
    height:7px;

    background:var(--pista-dark);

    border-radius:50%;

    animation:bounce 1.2s infinite;
}

.dot:nth-child(2){
    animation-delay:.15s;
}

.dot:nth-child(3){
    animation-delay:.3s;
}

@keyframes bounce{
    0%,80%,100%{
        transform:translateY(0);
        opacity:.4;
    }
    40%{
        transform:translateY(-5px);
        opacity:1;
    }
}

/* =========================
   INPUT
========================= */

.input-area{
    position:fixed;

    left:270px;
    right:0;
    bottom:0;

    padding:15px 20px 18px;

    background:linear-gradient(
        transparent,
        rgba(248,244,232,.98) 28%
    );

    z-index:30;
}

.input-wrapper{
    max-width:850px;
    margin:auto;

    background:var(--white);

    border:1px solid var(--border);

    border-radius:20px;

    box-shadow:0 12px 40px rgba(60,65,45,.13);

    padding:10px;

    display:flex;
    align-items:flex-end;
    gap:7px;
}

#messageInput{
    flex:1;

    border:none;
    outline:none;

    background:transparent;

    resize:none;

    min-height:42px;
    max-height:150px;

    padding:10px 8px;

    color:var(--text);
}

.send-btn{
    width:44px;
    height:44px;

    border:none;

    background:var(--pista-dark);
    color:white;

    border-radius:13px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.send-btn:hover{
    filter:brightness(.94);
}

.voice-btn.listening{
    background:#d2a15f;
    color:white;
}

/* =========================
   SCROLL BUTTONS
========================= */

.scroll-controls{
    position:fixed;

    right:22px;
    bottom:105px;

    display:flex;
    flex-direction:column;

    gap:7px;

    z-index:25;
}

.scroll-controls button{
    width:38px;
    height:38px;

    border:1px solid var(--border);

    background:var(--white);

    border-radius:11px;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:0 5px 18px rgba(60,65,45,.1);
}

.scroll-controls button:hover{
    background:var(--yellow);
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .sidebar{
        transform:translateX(-100%);
        width:280px;
        box-shadow:10px 0 35px rgba(0,0,0,.12);
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .main{
        margin-left:0;
        width:100%;
    }

    .input-area{
        left:0;
        padding:10px 10px 12px;
    }

    .menu-btn{
        display:flex;
    }

    .topbar{
        padding:0 13px;
    }

    .chat{
        padding:25px 13px 130px;
    }

    .welcome{
        margin:45px auto 30px;
    }

    .welcome h2{
        font-size:29px;
    }

    .tool-grid{
        grid-template-columns:1fr;
    }

    .message-inner{
        max-width:94%;
    }

    .message.user .message-inner{
        max-width:90%;
    }

    .bubble{
        font-size:14px;
    }

    .scroll-controls{
        right:10px;
        bottom:95px;
    }
}

/* =========================
   DARK MODE
========================= */

body.dark{
    --cream:#20251f;
    --white:#292e28;
    --text:#edf0e7;
    --muted:#aeb6a8;
    --border:#41483d;
    --user:#394735;
    --pista:#667457;
    --pista-dark:#879b72;
    --yellow:#5b5633;
}

body.dark .sidebar{
    background:#252b24;
}

body.dark .search-box input{
    background:#30362f;
    color:white;
}

body.dark .topbar{
    background:rgba(32,37,31,.9);
}

body.dark .tool-card:hover,
body.dark .history-item:hover,
body.dark .theme-btn:hover{
    background:#343b32;
}

body.dark .input-area{
    background:linear-gradient(
        transparent,
        rgba(32,37,31,.98) 28%
    );
}

body.dark .icon-btn,
body.dark .scroll-controls button{
    background:#292e28;
    color:white;
}

</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->

<aside class="sidebar" id="sidebar">

    <div class="logo-area">

        <div class="logo">P</div>

        <div class="logo-text">
            <h1>PochoJii AI</h1>
            <p>Poch jo poochna hai.</p>
        </div>

    </div>

    <button class="new-chat" onclick="newChat()">

        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14"/>
        </svg>

        New chat

    </button>

    <div class="search-box">

        <svg width="17" height="17" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"/>
            <path d="m20 20-3.5-3.5"/>
        </svg>

        <input
            id="searchInput"
            placeholder="Search chats..."
            oninput="searchChats()"
        >

    </div>

    <div class="history">

        <div class="history-title">
            Recent chats
        </div>

        <div id="historyList"></div>

    </div>

    <div class="sidebar-bottom">

        <button class="theme-btn" onclick="toggleTheme()">

            <svg width="18" height="18" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2">

                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2"/>
                <path d="M12 20v2"/>
                <path d="m4.93 4.93 1.42 1.42"/>
                <path d="m17.65 17.65 1.42 1.42"/>
                <path d="M2 12h2"/>
                <path d="M20 12h2"/>
                <path d="m4.93 19.07 1.42-1.42"/>
                <path d="m17.65 6.35 1.42-1.42"/>

            </svg>

            Toggle appearance

        </button>

    </div>

</aside>


<!-- MAIN -->

<main class="main">

    <header class="topbar">

        <button
            class="menu-btn"
            onclick="toggleSidebar()"
            aria-label="Open menu"
        >

            <svg width="22" height="22" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2">

                <path d="M4 6h16"/>
                <path d="M4 12h16"/>
                <path d="M4 18h16"/>

            </svg>

        </button>

        <div class="topbar-title">
            PochoJii AI
        </div>

        <div class="top-actions">

            <button class="icon-btn"
            onclick="makePDF()"
            title="Create PDF">

                <svg width="18" height="18" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2">

                    <path d="M6 2h9l5 5v15H6z"/>
                    <path d="M14 2v6h6"/>
                    <path d="M9 13h6"/>
                    <path d="M9 17h5"/>

                </svg>

            </button>

        </div>

    </header>


    <!-- CHAT -->

    <section class="chat" id="chat">

        <div class="welcome" id="welcome">

            <div class="welcome-logo">
                P
            </div>

            <h2>What can I help you with?</h2>

            <p>
                Ask anything. Learn, create, solve and explore.
            </p>

            <div class="tool-grid">

                <button
                    class="tool-card"
                    onclick="createImage()"
                >

                    <div class="tool-card-title">
                        Create an image
                    </div>

                    <div class="tool-card-description">
                        Generate an image from your idea.
                    </div>

                </button>


                <button
                    class="tool-card"
                    onclick="makePDF()"
                >

                    <div class="tool-card-title">
                        Make a PDF
                    </div>

                    <div class="tool-card-description">
                        Create and download a formatted PDF.
                    </div>

                </button>


                <button
                    class="tool-card"
                    onclick="quickPrompt('Teach me something interesting in a simple way.')"
                >

                    <div class="tool-card-title">
                        Teach me something
                    </div>

                    <div class="tool-card-description">
                        Learn something new.
                    </div>

                </button>


                <button
                    class="tool-card"
                    onclick="quickPrompt('Help me with a programming problem.')"
                >

                    <div class="tool-card-title">
                        Help me code
                    </div>

                    <div class="tool-card-description">
                        Learn programming and solve problems.
                    </div>

                </button>

            </div>

        </div>


        <div id="messages"></div>

    </section>


    <!-- SCROLL BUTTONS -->

    <div class="scroll-controls">

        <button onclick="scrollTopPage()" title="Go to top">

            <svg width="18" height="18" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2">

                <path d="m18 15-6-6-6 6"/>

            </svg>

        </button>


        <button onclick="scrollBottomPage()" title="Go to bottom">

            <svg width="18" height="18" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2">

                <path d="m6 9 6 6 6-6"/>

            </svg>

        </button>

    </div>


    <!-- INPUT -->

    <div class="input-area">

        <div class="input-wrapper">

            <button
                class="icon-btn"
                id="voiceBtn"
                onclick="startVoice()"
                title="Voice input"
            >

                <svg width="19" height="19" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2">

                    <rect x="9" y="2" width="6" height="12" rx="3"/>
                    <path d="M5 10a7 7 0 0 0 14 0"/>
                    <path d="M12 19v3"/>
                    <path d="M8 22h8"/>

                </svg>

            </button>


            <textarea
                id="messageInput"
                placeholder="Message PochoJii..."
                rows="1"
                onkeydown="handleKey(event)"
                oninput="resizeInput(this)"
            ></textarea>


            <button
                class="send-btn"
                onclick="sendMessage()"
                title="Send"
            >

                <svg width="19" height="19" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2">

                    <path d="m22 2-7 20-4-9-9-4Z"/>
                    <path d="M22 2 11 13"/>

                </svg>

            </button>

        </div>

    </div>

</main>

</div>


<script>

/* =========================
   CONFIG
========================= */

const API_URL =
"https://studybuddy-backend-kappa.vercel.app/api/chat";


/* =========================
   STATE
========================= */

let currentChat = [];
let chatHistory =
    JSON.parse(localStorage.getItem("pochojii_history") || "[]");

let isListening = false;
let recognition = null;


/* =========================
   START
========================= */

document.addEventListener("DOMContentLoaded", () => {

    loadTheme();
    renderHistory();

});


/* =========================
   CHAT
========================= */

async function sendMessage(){

    const input =
        document.getElementById("messageInput");

    const question =
        input.value.trim();

    if(!question) return;

    input.value = "";
    resizeInput(input);

    hideWelcome();

    addMessage("user", question);

    currentChat.push({
        role:"user",
        content:question
    });

    saveCurrentChat(question);

    const lower = question.toLowerCase();

    if(
        lower.startsWith("create image") ||
        lower.startsWith("generate image") ||
        lower.startsWith("make an image") ||
        lower.startsWith("make image")
    ){

        const prompt =
            question
                .replace(/^create image/i,"")
                .replace(/^generate image/i,"")
                .replace(/^make an image/i,"")
                .replace(/^make image/i,"")
                .trim();

        await generateImage(
            prompt || "A beautiful modern illustration"
        );

        return;
    }

    const typingId =
        addTyping();

    try{

        const response =
            await fetch(API_URL, {

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    question:question,
                    action:"chat"
                })

            });


        const data =
            await response.json();

        removeTyping(typingId);


        if(!response.ok){

            throw new Error(
                data.error ||
                "Something went wrong."
            );

        }


        const answer =
            data.answer ||
            "I couldn't generate an answer.";


        addAssistantMessage(answer);

        currentChat.push({
            role:"assistant",
            content:answer
        });

        saveChat();

    }catch(error){

        removeTyping(typingId);

        addAssistantMessage(
            "Sorry, something went wrong.\n\n" +
            error.message
        );

    }

}


/* =========================
   QUICK PROMPT
========================= */

function quickPrompt(text){

    document.getElementById(
        "messageInput"
    ).value = text;

    sendMessage();

}


/* =========================
   IMAGE GENERATION
========================= */

async function createImage(){

    const prompt =
        window.prompt(
            "What image should PochoJii create?"
        );

    if(!prompt || !prompt.trim()) return;

    hideWelcome();

    addMessage(
        "user",
        "Create an image: " + prompt
    );

    currentChat.push({
        role:"user",
        content:"Create an image: " + prompt
    });

    await generateImage(prompt);

}


async function generateImage(prompt){

    const typingId =
        addTyping();

    try{

        const response =
            await fetch(API_URL, {

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    question:prompt,

                    action:"image"

                })

            });


        const data =
            await response.json();

        removeTyping(typingId);


        if(!response.ok){

            throw new Error(
                data.error ||
                "Image generation failed."
            );

        }


        if(!data.image){

            throw new Error(
                "No image was returned."
            );

        }


        const wrapper =
            document.createElement("div");

        wrapper.className =
            "message assistant";


        const inner =
            document.createElement("div");

        inner.className =
            "message-inner";


        const bubble =
            document.createElement("div");

        bubble.className =
            "bubble";


        const image =
            document.createElement("img");

        image.className =
            "generated-image";

        image.src =
            data.image;

        image.alt =
            "Generated image";


        const download =
            document.createElement("a");

        download.className =
            "download-image";

        download.href =
            data.image;

        download.download =
            "pochojii-image.png";

        download.innerHTML = `

            <svg width="15" height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2">

                <path d="M12 3v12"/>
                <path d="m7 10 5 5 5-5"/>
                <path d="M5 21h14"/>

            </svg>

            Download image

        `;


        bubble.appendChild(image);
        bubble.appendChild(download);

        inner.appendChild(bubble);

        wrapper.appendChild(inner);

        document.getElementById(
            "messages"
        ).appendChild(wrapper);


        currentChat.push({
            role:"assistant",
            type:"image",
            content:"Generated image"
        });

        saveChat();

        scrollBottomPage();


    }catch(error){

        removeTyping(typingId);

        addAssistantMessage(
            "I couldn't create the image.\n\n" +
            error.message
        );

    }

}


/* =========================
   PDF
========================= */

async function makePDF(){

    const topic =
        window.prompt(
            "What should the PDF be about?"
        );

    if(!topic || !topic.trim()) return;

    hideWelcome();

    addMessage(
        "user",
        "Make a PDF about: " + topic
    );


    const typingId =
        addTyping();


    try{

        const response =
            await fetch(API_URL, {

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    question:
                        "Create a well-organized PDF document about: " +
                        topic +
                        "\n\nUse clear headings, sections, bullet points where useful, and useful explanations.",

                    action:"chat"

                })

            });


        const data =
            await response.json();


        removeTyping(typingId);


        if(!response.ok){

            throw new Error(
                data.error ||
                "Could not create PDF content."
            );

        }


        const content =
            data.answer ||
            "No content generated.";


        downloadPDF(
            topic,
            content
        );


        addAssistantMessage(
            "Your PDF has been created and downloaded."
        );


    }catch(error){

        removeTyping(typingId);

        addAssistantMessage(
            "I couldn't create the PDF.\n\n" +
            error.message
        );

    }

}


function downloadPDF(title, text){

    if(!window.jspdf){

        alert(
            "PDF library is still loading. Please try again."
        );

        return;
    }


    const {
        jsPDF
    } = window.jspdf;


    const doc =
        new jsPDF({

            unit:"mm",
            format:"a4"

        });


    const margin = 18;

    const pageWidth =
        doc.internal.pageSize.getWidth();

    const pageHeight =
        doc.internal.pageSize.getHeight();

    const usableWidth =
        pageWidth - margin * 2;


    doc.setFont(
        "helvetica",
        "bold"
    );

    doc.setFontSize(22);

    doc.setTextColor(
        80,
        100,
        68
    );


    const titleLines =
        doc.splitTextToSize(
            title,
            usableWidth
        );


    doc.text(
        titleLines,
        margin,
        25
    );


    doc.setFont(
        "helvetica",
        "normal"
    );

    doc.setFontSize(10);

    doc.setTextColor(
        110,
        110,
        100
    );


    doc.text(
        "Created with PochoJii AI",
        margin,
        35
    );


    doc.setDrawColor(
        200,
        200,
        185
    );

    doc.line(
        margin,
        40,
        pageWidth - margin,
        40
    );


    doc.setFontSize(11);

    doc.setTextColor(
        45,
        50,
        43
    );


    const lines =
        doc.splitTextToSize(
            cleanPDFText(text),
            usableWidth
        );


    let y = 50;


    for(const line of lines){

        if(y > pageHeight - 18){

            doc.addPage();

            y = 20;

        }


        doc.text(
            line,
            margin,
            y
        );

        y += 6;

    }


    const safeName =
        title
            .replace(/[^a-z0-9]/gi,"_")
            .substring(0,60);


    doc.save(
        "PochoJii_" +
        safeName +
        ".pdf"
    );

}


function cleanPDFText(text){

    return text
        .replace(/```/g,"")
        .replace(/\*\*/g,"")
        .replace(/###/g,"")
        .replace(/##/g,"")
        .replace(/#/g,"");

}


/* =========================
   MESSAGES
========================= */

function addMessage(role,text){

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message " + role;


    const inner =
        document.createElement("div");

    inner.className =
        "message-inner";


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.textContent =
        text;


    inner.appendChild(bubble);

    wrapper.appendChild(inner);


    document.getElementById(
        "messages"
    ).appendChild(wrapper);


    scrollBottomPage();

}


function addAssistantMessage(text){

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message assistant";


    const inner =
        document.createElement("div");

    inner.className =
        "message-inner";


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";


    bubble.innerHTML =
        formatAnswer(text);


    const actions =
        document.createElement("div");

    actions.className =
        "message-actions";


    const copy =
        document.createElement("button");

    copy.className =
        "small-action";

    copy.textContent =
        "Copy";

    copy.onclick =
        () => copyText(text);


    const speak =
        document.createElement("button");

    speak.className =
        "small-action";

    speak.textContent =
        "Read aloud";

    speak.onclick =
        () => speakText(text);


    actions.appendChild(copy);
    actions.appendChild(speak);


    inner.appendChild(bubble);
    inner.appendChild(actions);

    wrapper.appendChild(inner);


    document.getElementById(
        "messages"
    ).appendChild(wrapper);


    scrollBottomPage();

}


function formatAnswer(text){

    let safe =
        escapeHTML(text);


    safe =
        safe.replace(
            /```([\s\S]*?)```/g,
            "<pre><code>$1</code></pre>"
        );


    safe =
        safe.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );


    safe =
        safe.replace(
            /\n/g,
            "<br>"
        );


    return safe;

}


function escapeHTML(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   TYPING
========================= */

let typingCounter = 0;


function addTyping(){

    typingCounter++;

    const id =
        "typing-" + typingCounter;


    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message assistant";

    wrapper.id =
        id;


    wrapper.innerHTML = `

        <div class="message-inner">

            <div class="bubble">

                <div class="typing">

                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>

                </div>

            </div>

        </div>

    `;


    document.getElementById(
        "messages"
    ).appendChild(wrapper);


    scrollBottomPage();


    return id;

}


function removeTyping(id){

    const element =
        document.getElementById(id);

    if(element){
        element.remove();
    }

}


/* =========================
   COPY
========================= */

async function copyText(text){

    try{

        await navigator.clipboard.writeText(text);

    }catch{

        const area =
            document.createElement("textarea");

        area.value =
            text;

        document.body.appendChild(area);

        area.select();

        document.execCommand("copy");

        area.remove();

    }

}


/* =========================
   VOICE INPUT
========================= */

function startVoice(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        alert(
            "Voice input is not supported in this browser."
        );

        return;
    }


    if(isListening){

        recognition.stop();

        return;

    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-US";

    recognition.interimResults =
        false;

    recognition.continuous =
        false;


    recognition.onstart =
        () => {

            isListening = true;

            document
                .getElementById("voiceBtn")
                .classList
                .add("listening");

        };


    recognition.onresult =
        event => {

            const transcript =
                event.results[0][0].transcript;


            document.getElementById(
                "messageInput"
            ).value =
                transcript;


            resizeInput(
                document.getElementById(
                    "messageInput"
                )
            );


            sendMessage();

        };


    recognition.onerror =
        () => {

            stopListening();

        };


    recognition.onend =
        () => {

            stopListening();

        };


    recognition.start();

}


function stopListening(){

    isListening = false;

    document
        .getElementById("voiceBtn")
        .classList
        .remove("listening");

}


/* =========================
   READ ALOUD
========================= */

function speakText(text){

    if(!("speechSynthesis" in window)){

        alert(
            "Read aloud is not supported in this browser."
        );

        return;

    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(text);


    utterance.rate =
        .95;

    utterance.pitch =
        1;


    speechSynthesis.speak(
        utterance
    );

}


/* =========================
   INPUT
========================= */

function handleKey(event){

    if(
        event.key === "Enter" &&
        !event.shiftKey
    ){

        event.preventDefault();

        sendMessage();

    }

}


function resizeInput(element){

    element.style.height =
        "auto";

    element.style.height =
        Math.min(
            element.scrollHeight,
            150
        ) + "px";

}


/* =========================
   WELCOME
========================= */

function hideWelcome(){

    const welcome =
        document.getElementById(
            "welcome"
        );

    if(welcome){

        welcome.style.display =
            "none";

    }

}


/* =========================
   NEW CHAT
========================= */

function newChat(){

    currentChat = [];

    document.getElementById(
        "messages"
    ).innerHTML = "";


    const welcome =
        document.getElementById(
            "welcome"
        );

    welcome.style.display =
        "block";


    document.getElementById(
        "messageInput"
    ).focus();

}


/* =========================
   HISTORY
========================= */

function saveCurrentChat(firstMessage){

    if(!currentChat.length)
        return;


    const existing =
        chatHistory.find(
            x => x.id === currentChat.id
        );


    if(!currentChat.id){

        currentChat.id =
            Date.now();

        chatHistory.unshift({

            id:currentChat.id,

            title:
                firstMessage.substring(
                    0,
                    45
                ),

            messages:currentChat

        });

    }


    saveChat();

}


function saveChat(){

    if(!currentChat.id)
        return;


    const index =
        chatHistory.findIndex(
            x => x.id === currentChat.id
        );


    if(index !== -1){

        chatHistory[index].messages =
            currentChat;

    }


    localStorage.setItem(
        "pochojii_history",
        JSON.stringify(chatHistory)
    );


    renderHistory();

}


function renderHistory(){

    const list =
        document.getElementById(
            "historyList"
        );


    if(!list)
        return;


    list.innerHTML = "";


    chatHistory
        .slice(0,30)
        .forEach(chat => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "history-item";

            button.textContent =
                chat.title ||
                "Untitled chat";


            button.onclick =
                () => loadChat(chat.id);


            list.appendChild(button);

        });

}


function loadChat(id){

    const chat =
        chatHistory.find(
            x => x.id === id
        );


    if(!chat)
        return;


    currentChat =
        JSON.parse(
            JSON.stringify(chat.messages)
        );

    currentChat.id =
        id;


    document.getElementById(
        "messages"
    ).innerHTML = "";


    hideWelcome();


    currentChat.forEach(message => {

        if(message.type === "image"){

            return;

        }


        if(message.role === "user"){

            addMessage(
                "user",
                message.content
            );

        }else{

            addAssistantMessage(
                message.content
            );

        }

    });

}


/* =========================
   SEARCH
========================= */

function searchChats(){

    const query =
        document.getElementById(
            "searchInput"
        ).value
        .toLowerCase()
        .trim();


    const items =
        document.querySelectorAll(
            ".history-item"
        );


    items.forEach(item => {

        item.style.display =
            item.textContent
                .toLowerCase()
                .includes(query)
                ? "block"
                : "none";

    });

}


/* =========================
   THEME
========================= */

function toggleTheme(){

    document.body.classList.toggle(
        "dark"
    );


    localStorage.setItem(
        "pochojii_theme",
        document.body.classList.contains("dark")
            ? "dark"
            : "light"
    );

}


function loadTheme(){

    if(
        localStorage.getItem(
            "pochojii_theme"
        ) === "dark"
    ){

        document.body.classList.add(
            "dark"
        );

    }

}


/* =========================
   SCROLL
========================= */

function scrollTopPage(){

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


function scrollBottomPage(){

    window.scrollTo({
        top:document.body.scrollHeight,
        behavior:"smooth"
    });

}


/* =========================
   SIDEBAR
========================= */

function toggleSidebar(){

    document
        .getElementById("sidebar")
        .classList
        .toggle("open");

}
