<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>PochoJii AI</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {

  --bg: #f7f5ff;
  --sidebar: #ffffff;
  --card: #ffffff;
  --text: #22202b;
  --muted: #777382;
  --border: #e8e3f5;
  --primary: #7357ff;
  --primary-dark: #5b40df;
  --bubble-ai: #eeeaff;
  --input: #ffffff;

}

body.dark {

  --bg: #111019;
  --sidebar: #181620;
  --card: #1d1a27;
  --text: #f4f1ff;
  --muted: #aaa5b8;
  --border: #302b3c;
  --primary: #8a70ff;
  --primary-dark: #7357ff;
  --bubble-ai: #292535;
  --input: #1d1a27;

}

body {

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background: var(--bg);

  color: var(--text);

  height: 100vh;

  overflow: hidden;

}

button,
textarea,
input {

  font-family: inherit;

}

button {

  cursor: pointer;

}


/* APP */

.app {

  display: flex;

  height: 100vh;

}


/* SIDEBAR */

.sidebar {

  width: 270px;

  background:
    var(--sidebar);

  border-right:
    1px solid var(--border);

  padding: 18px;

  display: flex;

  flex-direction: column;

}

.brand {

  display: flex;

  align-items: center;

  gap: 10px;

  margin-bottom: 22px;

}

.brand-logo {

  width: 42px;

  height: 42px;

  border-radius: 14px;

  background: var(--primary);

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 23px;

}

.brand-name {

  font-size: 19px;

  font-weight: 800;

}

.brand-name span {

  color: var(--primary);

}

.new-chat {

  width: 100%;

  border: none;

  border-radius: 13px;

  padding: 13px;

  background: var(--primary);

  color: white;

  font-weight: bold;

  margin-bottom: 15px;

}

.search-box input {

  width: 100%;

  padding: 11px;

  border-radius: 11px;

  border:
    1px solid var(--border);

  background: var(--bg);

  color: var(--text);

  outline: none;

}

.history-title {

  color: var(--muted);

  font-size: 12px;

  font-weight: bold;

  margin:
    18px 4px 10px;

}

.history {

  flex: 1;

  overflow-y: auto;

}

.history-item {

  padding: 11px;

  border-radius: 10px;

  margin-bottom: 5px;

  cursor: pointer;

  font-size: 14px;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

}

.history-item:hover {

  background: var(--bubble-ai);

}

.sidebar-bottom {

  border-top:
    1px solid var(--border);

  padding-top: 13px;

}

.sidebar-btn {

  width: 100%;

  border: none;

  background: transparent;

  color: var(--text);

  text-align: left;

  padding: 10px;

  border-radius: 10px;

  margin-bottom: 5px;

}

.sidebar-btn:hover {

  background: var(--bubble-ai);

}


/* MAIN */

.main {

  flex: 1;

  display: flex;

  flex-direction: column;

  min-width: 0;

}

.topbar {

  height: 70px;

  padding: 0 25px;

  border-bottom:
    1px solid var(--border);

  background: var(--card);

  display: flex;

  justify-content: space-between;

  align-items: center;

}

.top-title {

  font-weight: bold;

  font-size: 16px;

}

.top-subtitle {

  color: var(--muted);

  font-size: 12px;

  margin-top: 3px;

}

.theme-btn {

  border: none;

  background: var(--bubble-ai);

  border-radius: 10px;

  width: 40px;

  height: 40px;

  font-size: 18px;

}

.mobile-menu {

  display: none;

}


/* CHAT */

.chat-area {

  flex: 1;

  overflow-y: auto;

  padding: 30px 20px;

}

.chat-content {

  max-width: 850px;

  margin: auto;

}


/* WELCOME */

.welcome {

  text-align: center;

  padding:
    55px 15px 30px;

}

.welcome-logo {

  width: 82px;

  height: 82px;

  margin:
    auto auto 20px;

  border-radius: 26px;

  background: var(--primary);

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 45px;

}

.welcome h1 {

  font-size: 38px;

  margin-bottom: 10px;

}

.welcome h1 span {

  color: var(--primary);

}

.tagline {

  color: var(--muted);

  font-size: 18px;

  margin-bottom: 30px;

}


/* QUICK BUTTONS */

.tools {

  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 10px;

  max-width: 650px;

  margin: auto;

}

.tool {

  padding: 15px;

  border:
    1px solid var(--border);

  background: var(--card);

  color: var(--text);

  border-radius: 14px;

  text-align: left;

  transition: 0.2s;

}

.tool:hover {

  border-color:
    var(--primary);

  transform:
    translateY(-2px);

}

.tool strong {

  display: block;

  margin-bottom: 5px;

}

.tool small {

  color: var(--muted);

}


/* MESSAGES */

.message {

  display: flex;

  margin-bottom: 25px;

  gap: 12px;

  align-items:
    flex-start;

}

.message.user {

  justify-content:
    flex-end;

}

.avatar {

  width: 36px;

  height: 36px;

  min-width: 36px;

  border-radius: 12px;

  display: flex;

  align-items: center;

  justify-content: center;

}

.ai-avatar {

  background:
    var(--bubble-ai);

}

.user-avatar {

  background:
    var(--primary);

  color: white;

}

.message-content {

  max-width: 78%;

}

.message-name {

  font-size: 11px;

  color: var(--muted);

  margin-bottom: 5px;

  font-weight: bold;

}

.bubble {

  padding: 13px 16px;

  border-radius: 17px;

  line-height: 1.6;

  white-space: pre-wrap;

  overflow-wrap:
    anywhere;

  font-size: 15px;

}

.ai-bubble {

  background:
    var(--bubble-ai);

  border-bottom-left-radius: 5px;

}

.user-bubble {

  background:
    var(--primary);

  color: white;

  border-bottom-right-radius: 5px;

}

.copy-btn {

  border: none;

  background: transparent;

  color: var(--muted);

  font-size: 12px;

  margin-top: 5px;

}


/* GENERATED IMAGE */

.generated-image {

  max-width: 100%;

  width: 500px;

  border-radius: 16px;

  margin-top: 5px;

  display: block;

}

.download-image {

  display: inline-block;

  margin-top: 8px;

  padding: 8px 12px;

  background: var(--primary);

  color: white;

  border-radius: 9px;

  text-decoration: none;

  font-size: 12px;

}


/* INPUT */

.input-wrapper {

  padding:
    15px 20px 20px;

  background: var(--bg);

}

.input-container {

  max-width: 850px;

  margin: auto;

  background: var(--input);

  border:
    1px solid var(--border);

  border-radius: 18px;

  padding: 8px;

  display: flex;

  align-items: flex-end;

}

#questionInput {

  flex: 1;

  border: none;

  outline: none;

  background: transparent;

  color: var(--text);

  resize: none;

  padding: 11px;

  min-height: 45px;

  max-height: 150px;

  font-size: 15px;

}

#sendBtn {

  width: 45px;

  height: 45px;

  border: none;

  border-radius: 13px;

  background:
    var(--primary);

  color: white;

  font-size: 18px;

}

.input-note {

  max-width: 850px;

  margin:
    8px auto 0;

  text-align: center;

  color: var(--muted);

  font-size: 10px;

}


/* TYPING */

.typing {

  display: flex;

  gap: 5px;

}

.dot {

  width: 7px;

  height: 7px;

  background:
    var(--primary);

  border-radius: 50%;

  animation:
    bounce 1.2s infinite;

}

.dot:nth-child(2) {

  animation-delay:
    .15s;

}

.dot:nth-child(3) {

  animation-delay:
    .3s;

}

@keyframes bounce {

  0%, 60%, 100% {

    transform:
      translateY(0);

    opacity: .5;

  }

  30% {

    transform:
      translateY(-5px);

    opacity: 1;

  }

}


/* MOBILE */

@media(max-width:750px) {

  .sidebar {

    position: fixed;

    left: -280px;

    top: 0;

    bottom: 0;

    z-index: 1000;

    transition: .25s;

  }

  .sidebar.open {

    left: 0;

  }

  .mobile-menu {

    display: block;

    border: none;

    background: transparent;

    color: var(--text);

    font-size: 22px;

    margin-right: 12px;

  }

  .top-left {

    display: flex;

    align-items: center;

  }

  .topbar {

    padding: 0 15px;

  }

  .tools {

    grid-template-columns:
      1fr;

  }

  .welcome h1 {

    font-size: 30px;

  }

  .message-content {

    max-width: 86%;

  }

}

</style>

</head>


<body>

<div class="app">


<!-- SIDEBAR -->

<aside
  class="sidebar"
  id="sidebar"
>

  <div class="brand">

    <div class="brand-logo">
      🤖
    </div>

    <div class="brand-name">
      PochoJii <span>AI</span>
    </div>

  </div>


  <button
    class="new-chat"
    onclick="newChat()"
  >
    ＋ New Chat
  </button>


  <div class="search-box">

    <input
      id="searchInput"
      placeholder="🔍 Search chats..."
      oninput="searchChats()"
    >

  </div>


  <div class="history-title">
    Recent Chats
  </div>


  <div
    class="history"
    id="history"
  ></div>


  <div class="sidebar-bottom">

    <button
      class="sidebar-btn"
      onclick="toggleDarkMode()"
    >
      🌙 Dark Mode
    </button>

    <button
      class="sidebar-btn"
      onclick="clearAllChats()"
    >
      🗑️ Clear History
    </button>

  </div>

</aside>


<!-- MAIN -->

<main class="main">


<header class="topbar">

  <div class="top-left">

    <button
      class="mobile-menu"
      onclick="toggleSidebar()"
    >
      ☰
    </button>

    <div>

      <div class="top-title">
        PochoJii AI
      </div>

      <div class="top-subtitle">
        Poch jo poochna hai. 💜
      </div>

    </div>

  </div>


  <button
    class="theme-btn"
    id="themeBtn"
    onclick="toggleDarkMode()"
  >
    🌙
  </button>

</header>


<section
  class="chat-area"
  id="chatArea"
>

<div
  class="chat-content"
  id="chatContent"
></div>

</section>


<div class="input-wrapper">

<div class="input-container">

<textarea
  id="questionInput"
  placeholder="Poch jo poochna hai..."
  rows="1"
></textarea>

<button
  id="sendBtn"
  onclick="askAI()"
>
➤
</button>

</div>


<div class="input-note">

PochoJii can make mistakes.
Check important information.

</div>

</div>


</main>

</div>


<script>


const API_URL =
"https://studybuddy-backend-kappa.vercel.app/api/chat";


const input =
document.getElementById(
  "questionInput"
);

const sendBtn =
document.getElementById(
  "sendBtn"
);

const chatContent =
document.getElementById(
  "chatContent"
);

const chatArea =
document.getElementById(
  "chatArea"
);

const history =
document.getElementById(
  "history"
);

const searchInput =
document.getElementById(
  "searchInput"
);


let chats =
JSON.parse(
  localStorage.getItem(
    "pochojii_chats"
  ) || "[]"
);


let currentChat = null;


/* =========================
   NEW CHAT
   ========================= */

function newChat() {

  currentChat = {

    id: Date.now(),

    title: "New Chat",

    messages: []

  };

  renderChat();

  input.focus();

  closeSidebar();

}


/* =========================
   WELCOME
   ========================= */

function renderChat() {

  chatContent.innerHTML = "";

  if (
    !currentChat ||
    currentChat.messages.length === 0
  ) {

    showWelcome();

    return;

  }


  currentChat.messages.forEach(
    message => {

      if (message.type === "image") {

        addImageToScreen(
          message.prompt,
          message.image,
          false
        );

      } else {

        addMessageToScreen(
          message.text,
          message.type,
          false
        );

      }

    }
  );


  scrollToBottom();

}


function showWelcome() {

  chatContent.innerHTML = `

    <div class="welcome">

      <div class="welcome-logo">
        🤖
      </div>

      <h1>
        Hey, I'm
        <span>PochoJii</span>!
      </h1>

      <p class="tagline">
        Poch jo poochna hai. 😎
      </p>


      <div class="tools">

        <button
          class="tool"
          onclick="startImageMode()"
        >

          <strong>
            🎨 Create an Image
          </strong>

          <small>
            Ask PochoJii to create a picture
          </small>

        </button>


        <button
          class="tool"
          onclick="startPDFMode()"
        >

          <strong>
            📄 Make a PDF
          </strong>

          <small>
            Create notes, reports or documents
          </small>

        </button>


        <button
          class="tool"
          onclick="useSuggestion(
            'Explain quantum physics simply'
          )"
        >

          <strong>
            🧠 Teach me something
          </strong>

          <small>
            Learn something interesting
          </small>

        </button>


        <button
          class="tool"
          onclick="useSuggestion(
            'Give me a cool Python project idea'
          )"
        >

          <strong>
            💻 Help me code
          </strong>

          <small>
            Get programming help
          </small>

        </button>

      </div>

    </div>

  `;

}


/* =========================
   TEXT MESSAGE
   ========================= */

function addMessageToScreen(
  text,
  type,
  save = true
) {

  const message =
    document.createElement("div");

  message.className =
    "message " + type;


  const avatar =
    document.createElement("div");

  avatar.className =
    "avatar " +
    (
      type === "ai"
      ? "ai-avatar"
      : "user-avatar"
    );

  avatar.textContent =
    type === "ai"
    ? "🤖"
    : "👤";


  const content =
    document.createElement("div");

  content.className =
    "message-content";


  const name =
    document.createElement("div");

  name.className =
    "message-name";

  name.textContent =
    type === "ai"
    ? "PochoJii AI"
    : "You";


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble " +
    (
      type === "ai"
      ? "ai-bubble"
      : "user-bubble"
    );

  bubble.textContent =
    text;


  content.appendChild(name);

  content.appendChild(bubble);


  if (type === "ai") {

    const copy =
      document.createElement("button");

    copy.className =
      "copy-btn";

    copy.textContent =
      "📋 Copy";

    copy.onclick = () => {

      navigator.clipboard
        .writeText(text);

      copy.textContent =
        "✅ Copied!";

      setTimeout(
        () => {
          copy.textContent =
            "📋 Copy";
        },
        1500
      );

    };

    content.appendChild(copy);

  }


  if (type === "user") {

    message.appendChild(content);

    message.appendChild(avatar);

  } else {

    message.appendChild(avatar);

    message.appendChild(content);

  }


  chatContent.appendChild(message);


  if (
    save &&
    currentChat
  ) {

    currentChat.messages.push({

      text: text,

      type: type

    });

    saveCurrentChat();

  }


  scrollToBottom();

}


/* =========================
   IMAGE MESSAGE
   ========================= */

function addImageToScreen(
  prompt,
  image,
  save = true
) {

  const message =
    document.createElement("div");

  message.className =
    "message ai";


  const avatar =
    document.createElement("div");

  avatar.className =
    "avatar ai-avatar";

  avatar.textContent =
    "🎨";


  const content =
    document.createElement("div");

  content.className =
    "message-content";


  const name =
    document.createElement("div");

  name.className =
    "message-name";

  name.textContent =
    "PochoJii AI";


  const imageElement =
    document.createElement("img");

  imageElement.className =
    "generated-image";

  imageElement.src =
    image;

  imageElement.alt =
    prompt;


  const download =
    document.createElement("a");

  download.className =
    "download-image";

  download.textContent =
    "⬇️ Save Image";

  download.href =
    image;

  download.download =
    "pochojii-image.png";


  content.appendChild(name);

  content.appendChild(
    imageElement
  );

  content.appendChild(
    download
  );


  message.appendChild(avatar);

  message.appendChild(content);


  chatContent.appendChild(message);


  if (
    save &&
    currentChat
  ) {

    currentChat.messages.push({

      type: "image",

      prompt: prompt,

      image: image

    });

    saveCurrentChat();

  }


  scrollToBottom();

}


/* =========================
   ASK AI
   ========================= */

async function askAI() {

  const question =
    input.value.trim();

  if (!question) return;


  if (!currentChat) {

    currentChat = {

      id: Date.now(),

      title:
        question.substring(0, 35),

      messages: []

    };

  }


  if (
    currentChat.messages.length === 0
  ) {

    currentChat.title =
      question.substring(0, 35);

  }


  addMessageToScreen(
    question,
    "user"
  );


  input.value = "";

  autoResize();


  sendBtn.disabled =
    true;

  sendBtn.textContent =
    "⏳";


  showTyping();


  try {

    const response =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body: JSON.stringify({

            question:
              question,

            action:
              "chat"

          })

        }
      );


    const data =
      await response.json();


    removeTyping();


    if (!response.ok) {

      addMessageToScreen(

        "Oops 😭 " +
        (
          data.error ||
          "Something went wrong."
        ),

        "ai"

      );

      return;

    }


    addMessageToScreen(
      data.answer,
      "ai"
    );


  } catch (error) {

    removeTyping();

    addMessageToScreen(

      "Oops 😭 I couldn't connect to PochoJii.",

      "ai"

    );

  }


  sendBtn.disabled =
    false;

  sendBtn.textContent =
    "➤";

  input.focus();

}


/* =========================
   IMAGE MODE
   ========================= */

function startImageMode() {

  input.value =
    "Create an image of ";

  input.focus();

  autoResize();

}


/* =========================
   CREATE IMAGE
   ========================= */

async function createImage() {

  const prompt =
    input.value.trim();

  if (!prompt) return;


  if (!currentChat) {

    currentChat = {

      id: Date.now(),

      title: "Image",

      messages: []

    };

  }


  addMessageToScreen(
    "🎨 " + prompt,
    "user"
  );


  input.value = "";

  autoResize();


  sendBtn.disabled =
    true;

  sendBtn.textContent =
    "🎨";


  showTyping();


  try {

    const response =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body: JSON.stringify({

            question:
              prompt,

            action:
              "image"

          })

        }
      );


    const data =
      await response.json();


    removeTyping();


    if (!response.ok) {

      addMessageToScreen(

        "Oops 😭 " +
        (
          data.error ||
          "Image generation failed."
        ),

        "ai"

      );

      return;

    }


    addImageToScreen(
      prompt,
      data.image
    );


  } catch (error) {

    removeTyping();

    addMessageToScreen(

      "Oops 😭 Image generation failed.",

      "ai"

    );

  }


  sendBtn.disabled =
    false;

  sendBtn.textContent =
    "➤";

}


/* =========================
   PDF MODE
   ========================= */

function startPDFMode() {

  const topic =
    prompt(
      "What should the PDF be about?"
    );


  if (!topic) return;


  makePDF(topic);

}


/* =========================
   MAKE PDF
   ========================= */

async function makePDF(topic) {

  if (!currentChat) {

    currentChat = {

      id: Date.now(),

      title:
        "PDF - " + topic,

      messages: []

    };

  }


  addMessageToScreen(

    "📄 Make a PDF about: " +
    topic,

    "user"

  );


  showTyping();


  try {

    const response =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body: JSON.stringify({

            question:
              "Create a well-organized document about: " +
              topic,

            action:
              "chat"

          })

        }
      );


    const data =
      await response.json();


    removeTyping();


    if (!response.ok) {

      addMessageToScreen(

        "Oops 😭 " +
        (
          data.error ||
          "PDF content failed."
        ),

        "ai"

      );

      return;

    }


    addMessageToScreen(
      data.answer,
      "ai"
    );


    createPrintablePDF(
      topic,
      data.answer
    );


  } catch (error) {

    removeTyping();

    addMessageToScreen(

      "Oops 😭 I couldn't create the PDF.",

      "ai"

    );

  }

}


/* =========================
   PRINT PDF
   ========================= */

function createPrintablePDF(
  title,
  content
) {

  const pdfWindow =
    window.open(
      "",
      "_blank"
    );


  if (!pdfWindow) {

    alert(
      "Please allow pop-ups for PochoJii to create the PDF."
    );

    return;

  }


  pdfWindow.document.write(`

    <!DOCTYPE html>

    <html>

function escapeHTML(text) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   TYPING
   ========================= */

function showTyping() {

  const typing =
    document.createElement("div");

  typing.id =
    "typing";

  typing.className =
    "message ai";


  typing.innerHTML = `

    <div class="avatar ai-avatar">
      🤖
    </div>

    <div class="message-content">

      <div class="message-name">
        PochoJii AI
      </div>

      <div class="bubble ai-bubble">

        <div class="typing">

          <div class="dot"></div>

          <div class="dot"></div>

          <div class="dot"></div>

        </div>

      </div>

    </div>

  `;


  chatContent.appendChild(
    typing
  );

  scrollToBottom();

}


function removeTyping() {

  const typing =
    document.getElementById(
      "typing"
    );

  if (typing) {

    typing.remove();

  }

}


/* =========================
   SUGGESTION
   ========================= */

function useSuggestion(text) {

  input.value =
    text;

  autoResize();

  input.focus();

  askAI();

}


/* =========================
   HISTORY
   ========================= */

function saveCurrentChat() {

  if (!currentChat)
    return;


  const index =
    chats.findIndex(
      chat =>
        chat.id ===
        currentChat.id
    );


  if (index === -1) {

    chats.unshift(
      currentChat
    );

  } else {

    chats[index] =
      currentChat;

  }


  localStorage.setItem(
    "pochojii_chats",
    JSON.stringify(chats)
  );


  renderHistory();

}


function renderHistory(
  filtered = chats
) {

  history.innerHTML =
    "";


  if (
    filtered.length === 0
  ) {

    history.innerHTML = `

      <div style="
        color:var(--muted);
        font-size:12px;
        padding:10px;
      ">
        No chats yet.
      </div>

    `;

    return;

  }


  filtered.forEach(
    chat => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "history-item";

      item.textContent =
        "💬 " +
        (
          chat.title ||
          "New Chat"
        );


      item.onclick =
        () => {

          currentChat =
            chat;

          renderChat();

          closeSidebar();

        };


      history.appendChild(
        item
      );

    }
  );

}


/* =========================
   SEARCH
   ========================= */

function searchChats() {

  const query =
    searchInput.value
      .toLowerCase()
      .trim();


  if (!query) {

    renderHistory(
      chats
    );

    return;

  }


  const filtered =
    chats.filter(
      chat =>
        (
          chat.title ||
          ""
        )
        .toLowerCase()
        .includes(query)
    );


  renderHistory(
    filtered
  );

}


/* =========================
   CLEAR
   ========================= */

function clearAllChats() {

  if (
    !confirm(
      "Delete all saved chats?"
    )
  ) return;


  chats = [];

  currentChat =
    null;


  localStorage.removeItem(
    "pochojii_chats"
  );


  renderHistory();

  newChat();

}


/* =========================
   DARK MODE
   ========================= */

function toggleDarkMode() {

  document.body
    .classList
    .toggle("dark");


  const dark =
    document.body
      .classList
      .contains("dark");


  localStorage.setItem(
    "pochojii_dark",
    dark
  );


  document.getElementById(
    "themeBtn"
  ).textContent =
    dark
    ? "☀️"
    : "🌙";

}


if (
  localStorage.getItem(
    "pochojii_dark"
  ) === "true"
) {

  document.body
    .classList
    .add("dark");

}


/* =========================
   MOBILE
   ========================= */

function toggleSidebar() {

  document.getElementById(
    "sidebar"
  )
  .classList
  .toggle("open");

}


function closeSidebar() {

  document.getElementById(
    "sidebar"
  )
  .classList
  .remove("open");

}


/* =========================
   INPUT
   ========================= */

function autoResize() {

  input.style.height =
    "auto";


  input.style.height =
    Math.min(
      input.scrollHeight,
      150
    ) + "px";

}


input.addEventListener(
  "input",
  autoResize
);


input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      askAI();

    }

  }
);


/* =========================
   SMART SEND
   ========================= */

sendBtn.addEventListener(
  "click",
  () => {

    const text =
      input.value
        .trim()
        .toLowerCase();


    if (
      text.startsWith(
        "create image"
      ) ||
      text.startsWith(
        "generate image"
      ) ||
      text.startsWith(
        "make an image"
      )
    ) {

      createImage();

    } else {

      askAI();

    }

  }
);


/* =========================
   SCROLL
   ========================= */

function scrollToBottom() {

  setTimeout(
    () => {

      chatArea.scrollTop =
        chatArea.scrollHeight;

    },
    50
  );

}


/* START */

renderHistory();

newChat();

</script>

</html>
