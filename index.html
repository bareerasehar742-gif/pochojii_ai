<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>PochoJii AI</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

:root {
  --cream: #f8f2e7;
  --cream2: #fffaf0;
  --pistachio: #b9cfa9;
  --pistachio-dark: #78966b;
  --yellow: #f5e7a9;
  --text: #374035;
  --muted: #788077;
  --white: #ffffff;
  --border: #d9decf;
  --shadow: 0 10px 30px rgba(80,90,65,.10);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      var(--cream),
      #eef3e5,
      #fff8d9
    );

  color: var(--text);
  min-height: 100vh;
}

/* =========================
   APP
========================= */

.app {
  min-height: 100vh;
  display: flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
  width: 270px;
  background: rgba(255,255,255,.78);
  backdrop-filter: blur(15px);
  border-right: 1px solid var(--border);
  padding: 20px;
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
  overflow-y: auto;
  z-index: 20;
}

.logo {
  font-size: 24px;
  font-weight: 800;
  margin-bottom: 20px;
}

.new-chat {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 14px;
  background: var(--pistachio);
  color: #263326;
  font-weight: 700;
  cursor: pointer;
  margin-bottom: 14px;
}

.new-chat:hover {
  filter: brightness(.97);
}

.search {
  width: 100%;
  padding: 11px 13px;
  border-radius: 12px;
  border: 1px solid var(--border);
  outline: none;
  background: var(--cream2);
  margin-bottom: 15px;
}

.history-title {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 8px;
}

.history-item {
  padding: 11px;
  border-radius: 11px;
  cursor: pointer;
  margin-bottom: 5px;
  font-size: 14px;
}

.history-item:hover {
  background: #eef3e8;
}

.history-item.active {
  background: var(--yellow);
}

/* =========================
   MAIN
========================= */

.main {
  margin-left: 270px;
  width: calc(100% - 270px);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* =========================
   TOPBAR
========================= */

.topbar {
  height: 70px;
  padding: 15px 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 10;

  background: rgba(248,242,231,.82);
  backdrop-filter: blur(15px);

  border-bottom: 1px solid var(--border);
}

.mobile-menu {
  display: none;
}

.top-actions {
  display: flex;
  gap: 8px;
}

.icon-btn {
  width: 40px;
  height: 40px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  background: var(--white);
  box-shadow: var(--shadow);
  font-size: 17px;
}

/* =========================
   CHAT
========================= */

.chat {
  width: min(950px, 94%);
  margin: auto;
  padding: 35px 0 160px;
}

.welcome {
  text-align: center;
  padding: 50px 10px 30px;
}

.welcome h1 {
  font-size: clamp(30px, 5vw, 48px);
  margin-bottom: 10px;
}

.welcome p {
  color: var(--muted);
}

/* =========================
   MESSAGE
========================= */

.message {
  display: flex;
  margin: 18px 0;
}

.message.user {
  justify-content: flex-end;
}

.message.assistant {
  justify-content: flex-start;
}

.bubble {
  max-width: 82%;
  padding: 15px 17px;
  border-radius: 18px;
  line-height: 1.6;
  white-space: pre-wrap;
  box-shadow: var(--shadow);
}

.user .bubble {
  background: var(--pistachio);
  border-bottom-right-radius: 5px;
}

.assistant .bubble {
  background: rgba(255,255,255,.92);
  border-bottom-left-radius: 5px;
}

/* =========================
   IMAGE
========================= */

.generated-image {
  max-width: 100%;
  border-radius: 18px;
  margin-top: 10px;
  box-shadow: var(--shadow);
}

.image-download {
  display: inline-block;
  margin-top: 8px;
  padding: 9px 13px;
  border-radius: 10px;
  background: var(--pistachio);
  color: var(--text);
  text-decoration: none;
  font-weight: 700;
}

/* =========================
   UPLOAD PREVIEW
========================= */

.upload-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 10px;
}

.file-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #edf3e7;
  border: 1px solid var(--border);
  padding: 7px 10px;
  border-radius: 11px;
  font-size: 13px;
}

.file-chip button {
  border: none;
  background: transparent;
  cursor: pointer;
  font-weight: bold;
  color: #65705f;
}

.preview {
  max-width: 120px;
  max-height: 100px;
  border-radius: 10px;
  display: block;
  margin-top: 6px;
}

/* =========================
   COMPOSER
========================= */

.composer-wrap {
  position: fixed;
  bottom: 0;
  left: 270px;
  right: 0;
  padding: 15px 20px 20px;

  background:
    linear-gradient(
      transparent,
      rgba(248,242,231,.97) 35%
    );
}

.composer {
  max-width: 950px;
  margin: auto;

  background: var(--white);
  border: 1px solid var(--border);

  border-radius: 20px;

  box-shadow: var(--shadow);

  padding: 10px;
}

textarea {
  width: 100%;
  border: none;
  outline: none;
  resize: none;
  min-height: 52px;
  max-height: 180px;
  padding: 12px;
  font: inherit;
  background: transparent;
  color: var(--text);
}

.composer-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 7px;
}

.left-actions,
.right-actions {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.action-btn {
  border: none;
  background: #eef2e9;
  color: var(--text);
  border-radius: 11px;
  padding: 9px 11px;
  cursor: pointer;
  font-weight: 600;
}

.action-btn:hover {
  background: var(--yellow);
}

.send-btn {
  background: var(--pistachio-dark);
  color: white;
}

/* Hidden file inputs */

.hidden-file {
  display: none;
}

/* =========================
   SCROLL BUTTONS
========================= */

.scroll-controls {
  position: fixed;
  right: 20px;
  bottom: 115px;

  display: flex;
  flex-direction: column;
  gap: 7px;

  z-index: 15;
}

.scroll-btn {
  width: 38px;
  height: 38px;
  border: none;
  border-radius: 50%;
  background: white;
  box-shadow: var(--shadow);
  cursor: pointer;
}

/* =========================
   LOADING
========================= */

.loading {
  display: inline-flex;
  gap: 5px;
}

.dot {
  width: 7px;
  height: 7px;
  background: var(--pistachio-dark);
  border-radius: 50%;
  animation: bounce 1s infinite;
}

.dot:nth-child(2) {
  animation-delay: .15s;
}

.dot:nth-child(3) {
  animation-delay: .3s;
}

@keyframes bounce {
  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-5px);
  }
}

/* =========================
   MOBILE
========================= */

@media(max-width: 750px) {

  .sidebar {
    transform: translateX(-100%);
    transition: .25s;
  }

  .sidebar.open {
    transform: translateX(0);
  }

  .main {
    margin-left: 0;
    width: 100%;
  }

  .mobile-menu {
    display: block;
  }

  .composer-wrap {
    left: 0;
  }

  .bubble {
    max-width: 90%;
  }

  .chat {
    padding-top: 15px;
  }
}

</style>
</head>

<body>

<div class="app">

<!-- =========================
     SIDEBAR
========================= -->

<aside class="sidebar" id="sidebar">

  <div class="logo">
    PochoJii AI
  </div>

  <button
    class="new-chat"
    onclick="newChat()"
  >
    New chat
  </button>

  <input
    class="search"
    id="historySearch"
    placeholder="Search chats..."
    oninput="renderHistory()"
  >

  <div class="history-title">
    CHAT HISTORY
  </div>

  <div id="history"></div>

</aside>


<!-- =========================
     MAIN
========================= -->

<main class="main">

  <header class="topbar">

    <button
      class="icon-btn mobile-menu"
      onclick="toggleSidebar()"
    >
      ☰
    </button>

    <strong id="pageTitle">
      PochoJii AI
    </strong>

    <div class="top-actions">

      <button
        class="icon-btn"
        onclick="toggleTheme()"
        title="Theme"
      >
        ◐
      </button>

    </div>

  </header>


  <section
    class="chat"
    id="chat"
  >

    <div
      class="welcome"
      id="welcome"
    >

      <h1>
        What are you studying today?
      </h1>

      <p>
        Ask questions, upload files, create images,
        or study with PochoJii AI.
      </p>

    </div>

  </section>


</main>

</div>


<!-- =========================
     SCROLL
========================= -->

<div class="scroll-controls">

  <button
    class="scroll-btn"
    onclick="scrollTopPage()"
  >
    ↑
  </button>

  <button
    class="scroll-btn"
    onclick="scrollBottomPage()"
  >
    ↓
  </button>

</div>


<!-- =========================
     COMPOSER
========================= -->

<div class="composer-wrap">

  <div class="composer">

    <div
      class="upload-list"
      id="uploadList"
    ></div>

    <textarea
      id="messageInput"
      placeholder="Ask PochoJii anything..."
      rows="1"
      onkeydown="handleEnter(event)"
    ></textarea>


    <div class="composer-actions">

      <div class="left-actions">

        <!-- IMAGE UPLOAD -->

        <button
          class="action-btn"
          onclick="document.getElementById('imageInput').click()"
          title="Upload images"
        >
          Image
        </button>

        <input
          id="imageInput"
          class="hidden-file"
          type="file"
          accept="image/*"
          multiple
          onchange="handleFiles(this.files)"
        >


        <!-- FILE UPLOAD -->

        <button
          class="action-btn"
          onclick="document.getElementById('fileInput').click()"
          title="Upload files"
        >
          File
        </button>

        <input
          id="fileInput"
          class="hidden-file"
          type="file"
          multiple
          accept=".pdf,.txt,.csv,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.json,.md,image/*"
          onchange="handleFiles(this.files)"
        >


        <!-- FOLDER -->

        <button
          class="action-btn"
          onclick="document.getElementById('folderInput').click()"
          title="Upload a folder"
        >
          Folder
        </button>

        <input
          id="folderInput"
          class="hidden-file"
          type="file"
          webkitdirectory
          directory
          multiple
          onchange="handleFiles(this.files)"
        >


        <!-- VOICE -->

        <button
          class="action-btn"
          onclick="startVoice()"
          title="Voice input"
        >
          Voice
        </button>


        <!-- IMAGE GENERATION -->

        <button
          class="action-btn"
          onclick="generateImage()"
          title="Generate image"
        >
          Create image
        </button>


        <!-- PDF -->

        <button
          class="action-btn"
          onclick="makePDF()"
          title="Create PDF"
        >
          PDF
        </button>

      </div>


      <div class="right-actions">

        <button
          class="action-btn"
          onclick="readLastAnswer()"
          title="Read last answer"
        >
          Read
        </button>

        <button
          class="action-btn send-btn"
          onclick="sendMessage()"
        >
          Send
        </button>

      </div>

    </div>

  </div>

</div>


<script>

/* =========================================
   CONFIG
========================================= */

const API_URL =
  "https://studybuddy-backend-kappa.vercel.app/api/chat";


/* =========================================
   STATE
========================================= */

let currentChat = null;

let selectedFiles = [];

let lastAssistantText = "";


/* =========================================
   CREATE CHAT
========================================= */

function createEmptyChat() {

  return {
    id: Date.now().toString(),

    title: "New chat",

    messages: [],

    createdAt: Date.now()
  };
}


/* =========================================
   LOAD SAVED CHATS
========================================= */

function getChats() {

  try {

    return JSON.parse(
      localStorage.getItem("pochojii_chats") || "[]"
    );

  } catch {

    return [];

  }
}


/* =========================================
   SAVE CHATS
========================================= */

function saveChats(chats) {

  localStorage.setItem(
    "pochojii_chats",
    JSON.stringify(chats)
  );
}


/* =========================================
   SAVE CURRENT CHAT
========================================= */

function saveCurrentChat() {

  if (!currentChat) return;

  const chats = getChats();

  const index =
    chats.findIndex(
      chat => chat.id === currentChat.id
    );

  if (index >= 0) {

    chats[index] = currentChat;

  } else {

    chats.unshift(currentChat);

  }

  saveChats(chats);

  localStorage.setItem(
    "pochojii_active_chat",
    currentChat.id
  );

  renderHistory();
}


/* =========================================
   START
========================================= */

function init() {

  const chats = getChats();

  const activeId =
    localStorage.getItem(
      "pochojii_active_chat"
    );

  const active =
    chats.find(
      chat => chat.id === activeId
    );

  if (active) {

    currentChat =
      JSON.parse(JSON.stringify(active));

    renderChat();

  } else {

    currentChat =
      createEmptyChat();

  }

  renderHistory();
}


init();


/* =========================================
   NEW CHAT
========================================= */

function newChat() {

  currentChat =
    createEmptyChat();

  selectedFiles = [];

  renderChat();

  renderUploads();

  localStorage.setItem(
    "pochojii_active_chat",
    currentChat.id
  );

  document
    .getElementById("messageInput")
    .focus();

}


/* =========================================
   RENDER CHAT
========================================= */

function renderChat() {

  const chat =
    document.getElementById("chat");

  chat.innerHTML = "";

  if (
    !currentChat ||
    !currentChat.messages.length
  ) {

    chat.innerHTML = `
      <div class="welcome" id="welcome">
        <h1>What are you studying today?</h1>
        <p>
          Ask questions, upload files,
          create images, or study with PochoJii AI.
        </p>
      </div>
    `;

    return;

  }


  currentChat.messages.forEach(
    message => {

      addMessageToUI(
        message.role,
        message.content
      );

    }
  );

}


/* =========================================
   ADD MESSAGE
========================================= */

function addMessageToUI(
  role,
  content
) {

  const chat =
    document.getElementById("chat");

  const wrapper =
    document.createElement("div");

  wrapper.className =
    `message ${role}`;

  const bubble =
    document.createElement("div");

  bubble.className = "bubble";

  bubble.textContent =
    content;

  wrapper.appendChild(
    bubble
  );

  chat.appendChild(
    wrapper
  );

  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });
}


/* =========================================
   LOADING
========================================= */

function addLoading() {

  const chat =
    document.getElementById("chat");

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message assistant";

  wrapper.id =
    "loadingMessage";

  wrapper.innerHTML = `
    <div class="bubble">
      <div class="loading">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  `;

  chat.appendChild(wrapper);

  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });
}


function removeLoading() {

  const loading =
    document.getElementById(
      "loadingMessage"
    );

  if (loading) {
    loading.remove();
  }
}


/* =========================================
   SEND MESSAGE
========================================= */

async function sendMessage() {

  const input =
    document.getElementById(
      "messageInput"
    );

  const question =
    input.value.trim();

  if (
    !question &&
    !selectedFiles.length
  ) {
    return;
  }


  if (!currentChat) {

    currentChat =
      createEmptyChat();

  }


  if (question) {

    currentChat.messages.push({
      role: "user",
      content: question
    });

    if (
      currentChat.title === "New chat"
    ) {

      currentChat.title =
        question.substring(0, 45);

    }

    addMessageToUI(
      "user",
      question
    );

  }


  input.value = "";

  saveCurrentChat();

  addLoading();


  try {

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            action: "chat",

            question,

            messages:
              currentChat.messages,

            files:
              await prepareFilesForAPI()

          })
        }
      );


    const data =
      await response.json();


    removeLoading();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Server error"
      );

    }


    const answer =
      data.answer ||
      "I couldn't generate an answer.";


    currentChat.messages.push({

      role: "assistant",

      content: answer

    });


    lastAssistantText =
      answer;


    addMessageToUI(
      "assistant",
      answer
    );


    saveCurrentChat();


    selectedFiles = [];

    renderUploads();

  } catch (error) {

    removeLoading();

    const errorText =
      "Sorry, something went wrong.\n\n" +
      error.message;

    addMessageToUI(
      "assistant",
      errorText
    );

  }

}


/* =========================================
   IMAGE GENERATION
========================================= */

async function generateImage() {

  const input =
    document.getElementById(
      "messageInput"
    );

  const prompt =
    input.value.trim();


  if (!prompt) {

    alert(
      "Type what you want the image to look like first."
    );

    input.focus();

    return;

  }


  if (!currentChat) {

    currentChat =
      createEmptyChat();

  }


  currentChat.messages.push({

    role: "user",

    content:
      "Create an image: " +
      prompt

  });


  addMessageToUI(
    "user",
    "Create an image: " +
    prompt
  );


  input.value = "";

  saveCurrentChat();

  addLoading();


  try {

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            action: "image",

            question: prompt

          })

        }
      );


    const data =
      await response.json();


    removeLoading();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Image generation failed."
      );

    }


    if (!data.image) {

      throw new Error(
        "The server did not return an image."
      );

    }


    showGeneratedImage(
      data.image
    );


    currentChat.messages.push({

      role: "assistant",

      content:
        "[Image generated successfully]"

    });


    saveCurrentChat();


  } catch (error) {

    removeLoading();

    addMessageToUI(
      "assistant",
      "Image generation failed:\n\n" +
      error.message
    );

  }

}


/* =========================================
   SHOW GENERATED IMAGE
========================================= */

function showGeneratedImage(
  imageData
) {

  const chat =
    document.getElementById("chat");


  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message assistant";


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";


  const image =
    document.createElement("img");

  image.src =
    imageData;

  image.className =
    "generated-image";


  const download =
    document.createElement("a");

  download.href =
    imageData;

  download.download =
    "pochojii-generated.png";

  download.className =
    "image-download";

  download.textContent =
    "Download image";


  bubble.appendChild(image);

  bubble.appendChild(
    document.createElement("br")
  );

  bubble.appendChild(
    download
  );

  wrapper.appendChild(
    bubble
  );

  chat.appendChild(
    wrapper
  );


  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });

}


/* =========================================
   FILE HANDLING
========================================= */

function handleFiles(fileList) {

  const incoming =
    Array.from(fileList || []);


  for (const file of incoming) {

    if (
      selectedFiles.some(
        f =>
          f.name === file.name &&
          f.size === file.size
      )
    ) {
      continue;
    }


    /*
     * Keep requests reasonably small
     * for a serverless deployment.
     */

    if (
      file.size >
      2 * 1024 * 1024
    ) {

      alert(
        `${file.name} is larger than 2 MB. ` +
        "Please choose a smaller file."
      );

      continue;

    }


    selectedFiles.push(file);

  }


  /*
   * Maximum 8 files per message.
   */

  if (
    selectedFiles.length > 8
  ) {

    selectedFiles =
      selectedFiles.slice(0, 8);

    alert(
      "Maximum 8 files per message."
    );

  }


  renderUploads();

}


/* =========================================
   RENDER UPLOADS
========================================= */

function renderUploads() {

  const container =
    document.getElementById(
      "uploadList"
    );

  container.innerHTML = "";


  selectedFiles.forEach(
    (file, index) => {

      const chip =
        document.createElement(
          "div"
        );

      chip.className =
        "file-chip";


      const info =
        document.createElement(
          "div"
        );

      info.textContent =
        file.name;


      if (
        file.type.startsWith(
          "image/"
        )
      ) {

        const preview =
          document.createElement(
            "img"
          );

        preview.className =
          "preview";

        preview.src =
          URL.createObjectURL(
            file
          );

        info.appendChild(
          preview
        );

      }


      const remove =
        document.createElement(
          "button"
        );

      remove.textContent =
        "×";

      remove.onclick =
        () => {

          selectedFiles.splice(
            index,
            1
          );

          renderUploads();

        };


      chip.appendChild(
        info
      );

      chip.appendChild(
        remove
      );


      container.appendChild(
        chip
      );

    }
  );

}


/* =========================================
   FILE → BASE64
========================================= */

function fileToBase64(file) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();

      reader.onload =
        () => resolve(
          reader.result
        );

      reader.onerror =
        reject;

      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================================
   PREPARE FILES
========================================= */

async function prepareFilesForAPI() {

  const result = [];

  for (
    const file of selectedFiles
  ) {

    const data =
      await fileToBase64(file);


    result.push({

      name:
        file.name,

      type:
        file.type ||
        "application/octet-stream",

      data

    });

  }

  return result;

}


/* =========================================
   HISTORY
========================================= */

function renderHistory() {

  const container =
    document.getElementById(
      "history"
    );

  const search =
    document
      .getElementById(
        "historySearch"
      )
      .value
      .toLowerCase();


  container.innerHTML = "";


  const chats =
    getChats()
      .filter(
        chat =>
          chat.title
            .toLowerCase()
            .includes(search)
      );


  chats.forEach(
    chat => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "history-item";


      if (
        currentChat &&
        currentChat.id === chat.id
      ) {

        item.classList.add(
          "active"
        );

      }


      item.textContent =
        chat.title ||
        "New chat";


      item.onclick =
        () => loadChat(chat.id);


      container.appendChild(
        item
      );

    }
  );

}


/* =========================================
   LOAD CHAT
========================================= */

function loadChat(id) {

  const chats =
    getChats();


  const chat =
    chats.find(
      c => c.id === id
    );


  if (!chat) return;


  currentChat =
    JSON.parse(
      JSON.stringify(chat)
    );


  localStorage.setItem(
    "pochojii_active_chat",
    id
  );


  selectedFiles = [];

  renderUploads();

  renderChat();

  renderHistory();

}


/* =========================================
   ENTER
========================================= */

function handleEnter(event) {

  if (
    event.key === "Enter" &&
    !event.shiftKey
  ) {

    event.preventDefault();

    sendMessage();

  }

}


/* =========================================
   VOICE
========================================= */

function startVoice() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {

    alert(
      "Voice input is not supported by this browser."
    );

    return;

  }


  const recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-US";

  recognition.interimResults =
    false;

  recognition.continuous =
    false;


  recognition.onresult =
    event => {

      const text =
        event.results[0][0].transcript;

      document
        .getElementById(
          "messageInput"
        )
        .value +=
        text;

    };


  recognition.onerror =
    () => {

      alert(
        "Voice input could not be started."
      );

    };


  recognition.start();

}


/* =========================================
   READ ALOUD
========================================= */

function readLastAnswer() {

  if (!lastAssistantText) {

    const messages =
      currentChat?.messages || [];

    const assistantMessages =
      messages.filter(
        m => m.role === "assistant"
      );

    if (
      assistantMessages.length
    ) {

      lastAssistantText =
        assistantMessages[
          assistantMessages.length - 1
        ].content;

    }

  }


  if (!lastAssistantText) {

    alert(
      "There is no answer to read yet."
    );

    return;

  }


  speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(
      lastAssistantText
    );

  speechSynthesis.speak(
    speech
  );

}


/* =========================================
   PDF
========================================= */

async function makePDF() {

  const topic =
    prompt(
      "What topic should the PDF be about?"
    );


  if (!topic) return;


  try {

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            action: "chat",

            question:
              `Create detailed study notes about ${topic}. ` +
              "Use headings, definitions, examples, " +
              "important points and a short summary.",

            messages: [

              {
                role: "user",

                content:
                  `Create detailed study notes about ${topic}.`
              }

            ]

          })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Could not create PDF."
      );

    }


    downloadPDF(
      topic,
      data.answer
    );


  } catch (error) {

    alert(
      "PDF creation failed:\n" +
      error.message
    );

  }

}


/* =========================================
   DOWNLOAD PDF
========================================= */

function downloadPDF(
  title,
  text
) {

  const {
    jsPDF
  } = window.jspdf;


  const pdf =
    new jsPDF();


  pdf.setFontSize(20);

  pdf.text(
    title,
    20,
    20
  );


  pdf.setFontSize(11);


  const lines =
    pdf.splitTextToSize(
      text,
      170
    );


  let y = 35;


  for (
    const line of lines
  ) {

    if (y > 280) {

      pdf.addPage();

      y = 20;

    }


    pdf.text(
      line,
      20,
      y
    );

    y += 7;

  }


  pdf.save(
    title
      .replace(
        /[^a-z0-9]/gi,
        "_"
      )
      + ".pdf"
  );

}


/* =========================================
   THEME
========================================= */

function toggleTheme() {

  const current =
    document.body.dataset.theme;


  if (
    current === "dark"
  ) {

    document.body.dataset.theme =
      "light";

    document.documentElement.style.setProperty(
      "--cream",
      "#f8f2e7"
    );

    document.documentElement.style.setProperty(
      "--cream2",
      "#fffaf0"
    );

    document.documentElement.style.setProperty(
      "--text",
      "#374035"
    );

  } else {

    document.body.dataset.theme =
      "dark";

    document.documentElement.style.setProperty(
      "--cream",
      "#1e251e"
    );

    document.documentElement.style.setProperty(
      "--cream2",
      "#293129"
    );

    document.documentElement.style.setProperty(
      "--text",
      "#edf3e7"
    );

  }

}
