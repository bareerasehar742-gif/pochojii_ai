<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>PochoJii AI</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

:root {
  --cream: #f8f2e7;
  --cream2: #fffaf0;
  --pistachio: #b9cfa9;
  --pistachio-dark: #78966b;
  --yellow: #f5e7a9;
  --text: #374035;
  --muted: #788077;
  --white: #ffffff;
  --border: #d9decf;
  --soft: #eef3e7;
  --shadow: 0 10px 30px rgba(80,90,65,.10);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      var(--cream),
      #eef3e5,
      #fff8d9
    );

  color: var(--text);
  min-height: 100vh;
}


/* =========================================
   APP
========================================= */

.app {
  min-height: 100vh;
  display: flex;
}


/* =========================================
   SIDEBAR
========================================= */

.sidebar {
  width: 270px;

  background:
    rgba(255,255,255,.82);

  backdrop-filter:
    blur(15px);

  border-right:
    1px solid var(--border);

  padding: 20px;

  position: fixed;

  left: 0;
  top: 0;
  bottom: 0;

  overflow-y: auto;

  z-index: 30;

  transition:
    transform .25s ease;
}

.logo {
  font-size: 25px;
  font-weight: 800;
  margin-bottom: 20px;
}

.new-chat {
  width: 100%;

  padding: 13px;

  border: none;

  border-radius: 14px;

  background:
    var(--pistachio);

  color:
    #263326;

  font-weight: 700;

  cursor: pointer;

  margin-bottom: 14px;
}

.new-chat:hover {
  filter: brightness(.96);
}

.search {
  width: 100%;

  padding: 11px 13px;

  border-radius: 12px;

  border:
    1px solid var(--border);

  outline: none;

  background:
    var(--cream2);

  color:
    var(--text);

  margin-bottom: 15px;
}

.history-title {
  font-size: 12px;

  color:
    var(--muted);

  margin-bottom: 8px;

  letter-spacing:
    .08em;
}

.history-item {
  padding: 11px;

  border-radius: 11px;

  cursor: pointer;

  margin-bottom: 5px;

  font-size: 14px;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.history-item:hover {
  background:
    #eef3e8;
}

.history-item.active {
  background:
    var(--yellow);
}


/* =========================================
   MAIN
========================================= */

.main {
  margin-left: 270px;

  width:
    calc(100% - 270px);

  min-height: 100vh;

  display: flex;

  flex-direction:
    column;
}


/* =========================================
   TOPBAR
========================================= */

.topbar {
  height: 70px;

  padding:
    15px 25px;

  display: flex;

  justify-content:
    space-between;

  align-items:
    center;

  position: sticky;

  top: 0;

  z-index: 20;

  background:
    rgba(248,242,231,.84);

  backdrop-filter:
    blur(15px);

  border-bottom:
    1px solid var(--border);
}

.mobile-menu {
  display: none;
}

.top-actions {
  display: flex;
  gap: 8px;
}

.icon-btn {
  width: 40px;
  height: 40px;

  border: none;

  border-radius: 12px;

  cursor: pointer;

  background:
    var(--white);

  color:
    var(--text);

  box-shadow:
    var(--shadow);

  font-size: 15px;

  font-weight: 700;
}


/* =========================================
   CHAT
========================================= */

.chat {
  width:
    min(950px, 94%);

  margin:
    auto;

  padding:
    35px 0 180px;
}

.welcome {
  text-align:
    center;

  padding:
    70px 10px 30px;
}

.welcome h1 {
  font-size:
    clamp(30px, 5vw, 48px);

  margin:
    0 0 12px;
}

.welcome p {
  color:
    var(--muted);

  max-width:
    600px;

  margin:
    auto;

  line-height:
    1.6;
}


/* =========================================
   MESSAGE
========================================= */

.message {
  display:
    flex;

  margin:
    18px 0;
}

.message.user {
  justify-content:
    flex-end;
}

.message.assistant {
  justify-content:
    flex-start;
}

.bubble {
  max-width:
    82%;

  padding:
    15px 17px;

  border-radius:
    18px;

  line-height:
    1.6;

  white-space:
    pre-wrap;

  word-break:
    break-word;

  box-shadow:
    var(--shadow);
}

.user .bubble {
  background:
    var(--pistachio);

  border-bottom-right-radius:
    5px;
}

.assistant .bubble {
  background:
    rgba(255,255,255,.94);

  border-bottom-left-radius:
    5px;
}


/* =========================================
   GENERATED IMAGE
========================================= */

.generated-image {
  display:
    block;

  max-width:
    100%;

  width:
    auto;

  border-radius:
    18px;

  margin-top:
    5px;

  box-shadow:
    var(--shadow);
}

.image-download {
  display:
    inline-block;

  margin-top:
    10px;

  padding:
    9px 13px;

  border-radius:
    10px;

  background:
    var(--pistachio);

  color:
    var(--text);

  text-decoration:
    none;

  font-weight:
    700;
}


/* =========================================
   UPLOAD PREVIEW
========================================= */

.upload-list {
  display:
    flex;

  flex-wrap:
    wrap;

  gap:
    8px;

  margin-bottom:
    8px;
}

.file-chip {
  display:
    flex;

  align-items:
    center;

  gap:
    8px;

  background:
    var(--soft);

  border:
    1px solid var(--border);

  padding:
    7px 10px;

  border-radius:
    11px;

  font-size:
    13px;

  max-width:
    100%;
}

.file-name {
  max-width:
    180px;

  overflow:
    hidden;

  text-overflow:
    ellipsis;

  white-space:
    nowrap;
}

.file-chip button {
  border:
    none;

  background:
    transparent;

  cursor:
    pointer;

  font-weight:
    700;

  color:
    #65705f;
}

.preview {
  max-width:
    70px;

  max-height:
    60px;

  border-radius:
    8px;

  display:
    block;
}


/* =========================================
   COMPOSER
========================================= */

.composer-wrap {
  position:
    fixed;

  bottom:
    0;

  left:
    270px;

  right:
    0;

  padding:
    15px 20px 20px;

  background:
    linear-gradient(
      transparent,
      rgba(248,242,231,.97) 35%
    );

  z-index:
    18;
}

.composer {
  max-width:
    950px;

  margin:
    auto;

  background:
    var(--white);

  border:
    1px solid var(--border);

  border-radius:
    20px;

  box-shadow:
    var(--shadow);

  padding:
    10px;
}

textarea {
  width:
    100%;

  border:
    none;

  outline:
    none;

  resize:
    none;

  min-height:
    52px;

  max-height:
    180px;

  padding:
    12px;

  font:
    inherit;

  background:
    transparent;

  color:
    var(--text);
}

.composer-actions {
  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  gap:
    7px;
}

.left-actions,
.right-actions {
  display:
    flex;

  gap:
    7px;

  flex-wrap:
    wrap;
}

.action-btn {
  border:
    none;

  background:
    #eef2e9;

  color:
    var(--text);

  border-radius:
    11px;

  padding:
    9px 11px;

  cursor:
    pointer;

  font-weight:
    600;

  transition:
    .15s;
}

.action-btn:hover {
  background:
    var(--yellow);
}

.send-btn {
  background:
    var(--pistachio-dark);

  color:
    white;
}

.hidden-file {
  display:
    none;
}


/* =========================================
   SCROLL BUTTONS
========================================= */

.scroll-controls {
  position:
    fixed;

  right:
    20px;

  bottom:
    125px;

  display:
    flex;

  flex-direction:
    column;

  gap:
    7px;

  z-index:
    19;
}

.scroll-btn {
  width:
    38px;

  height:
    38px;

  border:
    none;

  border-radius:
    50%;

  background:
    white;

  color:
    var(--text);

  box-shadow:
    var(--shadow);

  cursor:
    pointer;

  font-weight:
    800;

  font-size:
    18px;
}


/* =========================================
   LOADING
========================================= */

.loading {
  display:
    inline-flex;

  gap:
    5px;
}

.dot {
  width:
    7px;

  height:
    7px;

  background:
    var(--pistachio-dark);

  border-radius:
    50%;

  animation:
    bounce 1s infinite;
}

.dot:nth-child(2) {
  animation-delay:
    .15s;
}

.dot:nth-child(3) {
  animation-delay:
    .3s;
}

@keyframes bounce {

  0%, 100% {
    transform:
      translateY(0);
  }

  50% {
    transform:
      translateY(-5px);
  }

}


/* =========================================
   MOBILE
========================================= */

@media(max-width:750px) {

  .sidebar {
    transform:
      translateX(-100%);
  }

  .sidebar.open {
    transform:
      translateX(0);
  }

  .main {
    margin-left:
      0;

    width:
      100%;
  }

  .mobile-menu {
    display:
      block;
  }

  .composer-wrap {
    left:
      0;

    padding:
      10px;
  }

  .bubble {
    max-width:
      90%;
  }

  .chat {
    padding:
      20px 0 190px;
  }

  .composer-actions {
    align-items:
      flex-end;
  }

  .scroll-controls {
    right:
      10px;

    bottom:
      145px;
  }

  .action-btn {
    padding:
      8px 9px;

    font-size:
      12px;
  }

}


/* =========================================
   DARK THEME
========================================= */

body.dark {
  --cream:
    #1e251e;

  --cream2:
    #252d25;

  --text:
    #edf3e7;

  --muted:
    #adb7aa;

  --white:
    #293129;

  --border:
    #424d40;

  --soft:
    #303a30;

  background:
    linear-gradient(
      135deg,
      #1e251e,
      #273027,
      #303021
    );
}

body.dark .sidebar {
  background:
    rgba(31,38,31,.92);
}

body.dark .topbar {
  background:
    rgba(30,37,30,.88);
}

body.dark .assistant .bubble {
  background:
    #293129;
}

body.dark .user .bubble {
  background:
    #52684b;

  color:
    white;
}

body.dark .composer-wrap {
  background:
    linear-gradient(
      transparent,
      rgba(30,37,30,.98) 35%
    );
}

body.dark .action-btn {
  background:
    #303a30;

  color:
    #edf3e7;
}

body.dark .icon-btn,
body.dark .scroll-btn {
  background:
    #293129;

  color:
    #edf3e7;
}

body.dark .search {
  background:
    #293129;

  color:
    #edf3e7;
}

body.dark .history-item:hover {
  background:
    #303a30;
}

</style>
</head>


<body>

<div class="app">


<!-- =========================================
     SIDEBAR
========================================= -->

<aside
  class="sidebar"
  id="sidebar"
>

  <div class="logo">
    PochoJii AI
  </div>


  <button
    class="new-chat"
    onclick="newChat()"
  >
    New chat
  </button>


  <input
    class="search"
    id="historySearch"
    placeholder="Search chats..."
    oninput="renderHistory()"
  >


  <div class="history-title">
    CHAT HISTORY
  </div>


  <div id="history"></div>

</aside>



<!-- =========================================
     MAIN
========================================= -->

<main class="main">


<header class="topbar">

  <button
    class="icon-btn mobile-menu"
    onclick="toggleSidebar()"
  >
    Menu
  </button>


  <strong>
    PochoJii AI
  </strong>


  <div class="top-actions">

    <button
      class="icon-btn"
      onclick="toggleTheme()"
      title="Change theme"
    >
      Theme
    </button>

  </div>

</header>



<section
  class="chat"
  id="chat"
>

  <div
    class="welcome"
    id="welcome"
  >

    <h1>
      What are you studying today?
    </h1>

    <p>
      Ask questions, upload files,
      create images, make PDFs,
      or continue an old conversation.
    </p>

  </div>

</section>

</main>

</div>



<!-- =========================================
     SCROLL BUTTONS
========================================= -->

<div class="scroll-controls">

  <button
    class="scroll-btn"
    onclick="scrollTopPage()"
    title="Go to top"
  >
    ↑
  </button>


  <button
    class="scroll-btn"
    onclick="scrollBottomPage()"
    title="Go to bottom"
  >
    ↓
  </button>

</div>



<!-- =========================================
     COMPOSER
========================================= -->

<div class="composer-wrap">

  <div class="composer">


    <div
      class="upload-list"
      id="uploadList"
    ></div>


    <textarea
      id="messageInput"
      placeholder="Ask PochoJii anything..."
      rows="1"
      onkeydown="handleEnter(event)"
    ></textarea>



    <div class="composer-actions">


      <div class="left-actions">


        <!-- IMAGE -->

        <button
          class="action-btn"
          onclick="document.getElementById('imageInput').click()"
        >
          Image
        </button>

        <input
          id="imageInput"
          class="hidden-file"
          type="file"
          accept="image/*"
          multiple
          onchange="handleFiles(this.files)"
        >



        <!-- FILE -->

        <button
          class="action-btn"
          onclick="document.getElementById('fileInput').click()"
        >
          File
        </button>

        <input
          id="fileInput"
          class="hidden-file"
          type="file"
          multiple
          accept=".pdf,.txt,.csv,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.json,.md,image/*"
          onchange="handleFiles(this.files)"
        >



        <!-- FOLDER -->

        <button
          class="action-btn"
          onclick="document.getElementById('folderInput').click()"
        >
          Folder
        </button>

        <input
          id="folderInput"
          class="hidden-file"
          type="file"
          webkitdirectory
          directory
          multiple
          onchange="handleFiles(this.files)"
        >



        <!-- VOICE -->

        <button
          class="action-btn"
          onclick="startVoice()"
        >
          Voice
        </button>



        <!-- IMAGE GENERATION -->

        <button
          class="action-btn"
          onclick="generateImage()"
        >
          Create image
        </button>



        <!-- PDF -->

        <button
          class="action-btn"
          onclick="makePDF()"
        >
          PDF
        </button>

      </div>



      <div class="right-actions">


        <!-- READ -->

        <button
          class="action-btn"
          onclick="readLastAnswer()"
        >
          Read
        </button>



        <!-- SEND -->

        <button
          class="action-btn send-btn"
          onclick="sendMessage()"
        >
          Send
        </button>

      </div>

    </div>

  </div>

</div>



<script>

/* =====================================================
   CONFIG
===================================================== */

const API_URL =
  "https://studybuddy-backend-kappa.vercel.app/api/chat";


/* =====================================================
   STATE
===================================================== */

let currentChat = null;

let selectedFiles = [];

let lastAssistantText = "";

let isSending = false;


/* =====================================================
   CHAT
===================================================== */

function createEmptyChat() {

  return {

    id:
      Date.now().toString(),

    title:
      "New chat",

    messages:
      [],

    createdAt:
      Date.now()

  };

}


/* =====================================================
   STORAGE
===================================================== */

function getChats() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "pochojii_chats"
      ) || "[]"
    );

  } catch {

    return [];

  }

}


function saveChats(chats) {

  localStorage.setItem(
    "pochojii_chats",
    JSON.stringify(chats)
  );

}


function saveCurrentChat() {

  if (!currentChat) return;


  const chats =
    getChats();


  const index =
    chats.findIndex(
      chat =>
        chat.id ===
        currentChat.id
    );


  if (index >= 0) {

    chats[index] =
      currentChat;

  } else {

    chats.unshift(
      currentChat
    );

  }


  saveChats(chats);


  localStorage.setItem(
    "pochojii_active_chat",
    currentChat.id
  );


  renderHistory();

}


/* =====================================================
   INITIALIZE
===================================================== */

function init() {

  const chats =
    getChats();


  const activeId =
    localStorage.getItem(
      "pochojii_active_chat"
    );


  const active =
    chats.find(
      chat =>
        chat.id ===
        activeId
    );


  if (active) {

    currentChat =
      JSON.parse(
        JSON.stringify(active)
      );


    const assistantMessages =
      currentChat.messages.filter(
        message =>
          message.role ===
          "assistant"
      );


    if (
      assistantMessages.length
    ) {

      lastAssistantText =
        assistantMessages[
          assistantMessages.length - 1
        ].content;

    }


    renderChat();

  } else {

    currentChat =
      createEmptyChat();

  }


  renderHistory();

  renderUploads();

}


init();


/* =====================================================
   NEW CHAT
===================================================== */

function newChat() {

  currentChat =
    createEmptyChat();


  selectedFiles =
    [];


  lastAssistantText =
    "";


  renderChat();

  renderUploads();


  localStorage.setItem(
    "pochojii_active_chat",
    currentChat.id
  );


  renderHistory();


  const input =
    document.getElementById(
      "messageInput"
    );


  if (input) {

    input.value =
      "";

    input.focus();

  }

}


/* =====================================================
   RENDER CHAT
===================================================== */

function renderChat() {

  const chat =
    document.getElementById(
      "chat"
    );


  if (!chat) return;


  chat.innerHTML =
    "";


  if (
    !currentChat ||
    !currentChat.messages ||
    !currentChat.messages.length
  ) {

    chat.innerHTML = `

      <div
        class="welcome"
        id="welcome"
      >

        <h1>
          What are you studying today?
        </h1>

        <p>
          Ask questions, upload files,
          create images, make PDFs,
          or continue an old conversation.
        </p>

      </div>

    `;

    return;

  }


  currentChat.messages.forEach(
    message => {

      if (
        !message ||
        !message.content
      ) {

        return;

      }


      addMessageToUI(
        message.role,
        message.content
      );

    }
  );

}


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessageToUI(
  role,
  content
) {

  const chat =
    document.getElementById(
      "chat"
    );


  if (!chat) return;


  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    `message ${role}`;


  const bubble =
    document.createElement(
      "div"
    );


  bubble.className =
    "bubble";


  bubble.textContent =
    content;


  wrapper.appendChild(
    bubble
  );


  chat.appendChild(
    wrapper
  );


  window.scrollTo({

    top:
      document.body.scrollHeight,

    behavior:
      "smooth"

  });

}


/* =====================================================
   LOADING
===================================================== */

function addLoading() {

  const chat =
    document.getElementById(
      "chat"
    );


  if (!chat) return;


  removeLoading();


  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    "message assistant";


  wrapper.id =
    "loadingMessage";


  wrapper.innerHTML = `

    <div class="bubble">

      <div class="loading">

        <span class="dot"></span>

        <span class="dot"></span>

        <span class="dot"></span>

      </div>

    </div>

  `;


  chat.appendChild(
    wrapper
  );


  window.scrollTo({

    top:
      document.body.scrollHeight,

    behavior:
      "smooth"

  });

}


function removeLoading() {

  const loading =
    document.getElementById(
      "loadingMessage"
    );


  if (loading) {

    loading.remove();

  }

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage() {

  if (isSending) return;


  const input =
    document.getElementById(
      "messageInput"
    );


  if (!input) return;


  const question =
    input.value.trim();


  if (
    !question &&
    !selectedFiles.length
  ) {

    return;

  }


  isSending =
    true;


  if (!currentChat) {

    currentChat =
      createEmptyChat();

  }


  if (question) {

    currentChat.messages.push({

      role:
        "user",

      content:
        question

    });


    if (
      currentChat.title ===
      "New chat"
    ) {

      currentChat.title =
        question
          .replace(
            /\s+/g,
            " "
          )
          .substring(
            0,
            45
          );

    }


    addMessageToUI(
      "user",
      question
    );

  }


  input.value =
    "";


  saveCurrentChat();

  addLoading();


  try {

    const files =
      await prepareFilesForAPI();


    const response =
      await fetch(

        API_URL,

        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              action:
                "chat",

              question:
                question,

              messages:
                currentChat.messages,

              files:
                files

            })

        }

      );


    const data =
      await response.json();


    removeLoading();


    if (!response.ok) {

      throw new Error(

        data.error ||
        "Server error"

      );

    }


    const answer =
      data.answer ||
      "I couldn't generate an answer.";


    currentChat.messages.push({

      role:
        "assistant",

      content:
        answer

    });


    lastAssistantText =
      answer;


    addMessageToUI(
      "assistant",
      answer
    );


    saveCurrentChat();


    selectedFiles =
      [];


    renderUploads();


  } catch (error) {

    removeLoading();


    addMessageToUI(

      "assistant",

      "Sorry, something went wrong.\n\n" +
      error.message

    );

  } finally {

    isSending =
      false;

  }

}


/* =====================================================
   IMAGE GENERATION
===================================================== */

async function generateImage() {

  if (isSending) return;


  const input =
    document.getElementById(
      "messageInput"
    );


  if (!input) return;


  const prompt =
    input.value.trim();


  if (!prompt) {

    alert(
      "Type what you want the image to look like first."
    );

    input.focus();

    return;

  }


  if (!currentChat) {

    currentChat =
      createEmptyChat();

  }


  const request =
    "Create an image: " +
    prompt;


  currentChat.messages.push({

    role:
      "user",

    content:
      request

  });


  addMessageToUI(
    "user",
    request
  );


  if (
    currentChat.title ===
    "New chat"
  ) {

    currentChat.title =
      prompt.substring(
        0,
        45
      );

  }


  input.value =
    "";


  saveCurrentChat();

  addLoading();


  isSending =
    true;


  try {

    const response =
      await fetch(

        API_URL,

        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              action:
                "image",

              question:
                prompt

            })

        }

      );


    const data =
      await response.json();


    removeLoading();


    if (!response.ok) {

      throw new Error(

        data.error ||
        "Image generation failed."

      );

    }


    if (!data.image) {

      throw new Error(
        "No image was returned by the server."
      );

    }


    showGeneratedImage(
      data.image
    );


    currentChat.messages.push({

      role:
        "assistant",

      content:
        "[Image generated successfully]"

    });


    saveCurrentChat();


  } catch (error) {

    removeLoading();


    addMessageToUI(

      "assistant",

      "Image generation failed:\n\n" +
      error.message

    );

  } finally {

    isSending =
      false;

  }

}


/* =====================================================
   SHOW GENERATED IMAGE
===================================================== */

function showGeneratedImage(
  imageData
) {

  const chat =
    document.getElementById(
      "chat"
    );


  if (!chat) return;


  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    "message assistant";


  const bubble =
    document.createElement(
      "div"
    );


  bubble.className =
    "bubble";


  const image =
    document.createElement(
      "img"
    );


  image.src =
    imageData;


  image.className =
    "generated-image";


  const download =
    document.createElement(
      "a"
    );


  download.href =
    imageData;


  download.download =
    "pochojii-generated.png";


  download.className =
    "image-download";


  download.textContent =
    "Download image";


  bubble.appendChild(
    image
  );


  bubble.appendChild(
    document.createElement(
      "br"
    )
  );


  bubble.appendChild(
    download
  );


  wrapper.appendChild(
    bubble
  );


  chat.appendChild(
    wrapper
  );


  window.scrollTo({

    top:
      document.body.scrollHeight,

    behavior:
      "smooth"

  });

}


/* =====================================================
   FILE LIMITS
===================================================== */

const MAX_FILE_SIZE =
  2 * 1024 * 1024;

const MAX_TOTAL_SIZE =
  3 * 1024 * 1024;

const MAX_FILES =
  8;


function getSelectedFilesSize() {

  return selectedFiles.reduce(

    (
      total,
      file
    ) =>
      total +
      file.size,

    0

  );

}


/* =====================================================
   HANDLE FILES
===================================================== */

function handleFiles(
  fileList
) {

  const incoming =
    Array.from(
      fileList || []
    );


  for (
    const file of incoming
  ) {

    if (
      selectedFiles.length >=
      MAX_FILES
    ) {

      alert(
        "Maximum 8 files per message."
      );

      break;

    }


    const duplicate =
      selectedFiles.some(

        existing =>

          existing.name ===
            file.name &&

          existing.size ===
            file.size &&

          existing.lastModified ===
            file.lastModified

      );


    if (duplicate) {

      continue;

    }


    if (
      file.size >
      MAX_FILE_SIZE
    ) {

      alert(

        `${file.name} is larger than 2 MB.`

      );

      continue;

    }


    const newTotal =
      getSelectedFilesSize() +
      file.size;


    if (
      newTotal >
      MAX_TOTAL_SIZE
    ) {

      alert(
        "The total upload size cannot be more than 3 MB."
      );

      continue;

    }


    selectedFiles.push(
      file
    );

  }


  renderUploads();

}


/* =====================================================
   RENDER UPLOADS
===================================================== */

function renderUploads() {

  const container =
    document.getElementById(
      "uploadList"
    );


  if (!container) return;


  container.innerHTML =
    "";


  selectedFiles.forEach(

    (
      file,
      index
    ) => {


      const chip =
        document.createElement(
          "div"
        );


      chip.className =
        "file-chip";


      const info =
        document.createElement(
          "div"
        );


      const name =
        document.createElement(
          "div"
        );


      name.className =
        "file-name";


      name.textContent =
        file.name;


      info.appendChild(
        name
      );


      if (
        file.type &&
        file.type.startsWith(
          "image/"
        )
      ) {

        const preview =
          document.createElement(
            "img"
          );


        preview.className =
          "preview";


        preview.src =
          URL.createObjectURL(
            file
          );


        info.appendChild(
          preview
        );

      }


      const remove =
        document.createElement(
          "button"
        );


      remove.textContent =
        "Remove";


      remove.onclick =
        () => {

          selectedFiles.splice(
            index,
            1
          );

          renderUploads();

        };


      chip.appendChild(
        info
      );


      chip.appendChild(
        remove
      );


      container.appendChild(
        chip
      );

    }

  );

}


/* =====================================================
   FILE TO BASE64
===================================================== */

function fileToBase64(
  file
) {

  return new Promise(

    (
      resolve,
      reject
    ) => {

      const reader =
        new FileReader();


      reader.onload =
        () => {

          resolve(
            reader.result
          );

        };


      reader.onerror =
        () => {

          reject(

            new Error(
              `Could not read ${file.name}`
            )

          );

        };


      reader.readAsDataURL(
        file
      );

    }

  );

}


/* =====================================================
   PREPARE FILES
===================================================== */

async function prepareFilesForAPI() {

  const result =
    [];


  for (
    const file of selectedFiles
  ) {

    const data =
      await fileToBase64(
        file
      );


    result.push({

      name:
        file.name,

      type:
        file.type ||
        "application/octet-stream",

      data:
        data

    });

  }


  return result;

}


/* =====================================================
   CHAT HISTORY
===================================================== */

function renderHistory() {

  const container =
    document.getElementById(
      "history"
    );


  if (!container) return;


  const searchInput =
    document.getElementById(
      "historySearch"
    );


  const search =
    searchInput
      ? searchInput.value
          .toLowerCase()
      : "";


  container.innerHTML =
    "";


  const chats =
    getChats()

      .filter(

        chat =>

          (
            chat.title ||
            "New chat"
          )
          .toLowerCase()
          .includes(
            search
          )

      )

      .sort(

        (
          a,
          b
        ) =>

          (
            b.createdAt ||
            0
          ) -

          (
            a.createdAt ||
            0
          )

      );


  chats.forEach(
    chat => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "history-item";


      if (
        currentChat &&
        currentChat.id ===
          chat.id
      ) {

        item.classList.add(
          "active"
        );

      }


      item.textContent =
        chat.title ||
        "New chat";


      item.onclick =
        () => {

          loadChat(
            chat.id
          );

        };


      container.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   LOAD CHAT
===================================================== */

function loadChat(
  id
) {

  const chats =
    getChats();


  const chat =
    chats.find(
      item =>
        item.id ===
        id
    );


  if (!chat) return;


  currentChat =
    JSON.parse(
      JSON.stringify(chat)
    );


  selectedFiles =
    [];


  localStorage.setItem(
    "pochojii_active_chat",
    id
  );


  const assistantMessages =
    currentChat.messages.filter(

      message =>
        message.role ===
        "assistant"

    );


  lastAssistantText =
    assistantMessages.length

      ? assistantMessages[
          assistantMessages.length - 1
        ].content

      : "";


  renderUploads();

  renderChat();

  renderHistory();

}


/* =====================================================
   ENTER
===================================================== */

function handleEnter(
  event
) {

  if (
    event.key ===
      "Enter" &&
    !event.shiftKey
  ) {

    event.preventDefault();

    sendMessage();

  }

}


/* =====================================================
   VOICE INPUT
===================================================== */

function startVoice() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {

    alert(
      "Voice input is not supported by this browser."
    );

    return;

  }


  const recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-US";


  recognition.interimResults =
    false;


  recognition.continuous =
    false;


  recognition.onresult =
    event => {

      const text =
        event
          .results[0][0]
          .transcript;


      const input =
        document.getElementById(
          "messageInput"
        );


      if (!input) return;


      if (input.value) {

        input.value +=
          " " + text;

      } else {

        input.value =
          text;

      }


      input.focus();

    };


  recognition.onerror =
    () => {

      alert(
        "Voice input could not be started."
      );

    };


  recognition.start();

}


/* =====================================================
   READ LAST ANSWER
===================================================== */

function readLastAnswer() {

  if (!lastAssistantText) {

    const messages =
      currentChat?.messages ||
      [];


    const assistantMessages =
      messages.filter(

        message =>
          message.role ===
          "assistant"

      );


    if (
      assistantMessages.length
    ) {

      lastAssistantText =
        assistantMessages[
          assistantMessages.length - 1
        ].content;

    }

  }


  if (!lastAssistantText) {

    alert(
      "There is no answer to read yet."
    );

    return;

  }


  if (
    "speechSynthesis" in window
  ) {

    speechSynthesis.cancel();


    const speech =
      new SpeechSynthesisUtterance(
        lastAssistantText
      );


    speechSynthesis.speak(
      speech
    );

  }

}


/* =====================================================
   PDF
===================================================== */

async function makePDF() {

  const topic =
    prompt(
      "What topic should the PDF be about?"
    );


  if (!topic) return;


  try {

    const response =
      await fetch(

        API_URL,

        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              action:
                "chat",

              question:
                `Create detailed study notes about ${topic}. ` +
                "Use headings, definitions, examples, " +
                "important points and a short summary.",

              messages: [

                {

                  role:
                    "user",

                  content:
                    `Create detailed study notes about ${topic}.`

                }

              ]

            })

        }

      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(

        data.error ||
        "Could not create PDF."

      );

    }


    downloadPDF(
      topic,
      data.answer
    );


  } catch (error) {

    alert(
      "PDF creation failed:\n" +
      error.message
    );

  }

}


/* =====================================================
   DOWNLOAD PDF
===================================================== */

function downloadPDF(
  title,
  text
) {

  if (
    !window.jspdf ||
    !window.jspdf.jsPDF
  ) {

    alert(
      "PDF library could not be loaded."
    );

    return;

  }


  const {
    jsPDF
  } =
    window.jspdf;


  const pdf =
    new jsPDF();


  pdf.setFontSize(
    20
  );


  pdf.text(
    title,
    20,
    20
  );


  pdf.setFontSize(
    11
  );


  const lines =
    pdf.splitTextToSize(
      text,
      170
    );


  let y =
    35;


  for (
    const line of lines
  ) {

    if (
      y > 280
    ) {

      pdf.addPage();

      y =
        20;

    }


    pdf.text(
      line,
      20,
      y
    );


    y +=
      7;

  }


  pdf.save(

    title
      .replace(
        /[^a-z0-9]/gi,
        "_"
      )

      + ".pdf"

  );

}


/* =====================================================
   THEME
===================================================== */

function toggleTheme() {

  document.body.classList.toggle(
    "dark"
  );


  const isDark =
    document.body.classList.contains(
      "dark"
    );


  localStorage.setItem(
    "pochojii_theme",
    isDark
      ? "dark"
      : "light"
  );

}


/* =====================================================
   LOAD THEME
===================================================== */

function loadTheme() {

  const theme =
    localStorage.getItem(
      "pochojii_theme"
    );


  if (
    theme ===
    "dark"
  ) {

    document.body.classList.add(
      "dark"
    );

  }

}


loadTheme();


/* =====================================================
   SIDEBAR
===================================================== */

function toggleSidebar() {

  const sidebar =
    document.getElementById(
      "sidebar"
    );


  if (!sidebar) return;


  sidebar.classList.toggle(
    "open"
  );

}


/* =====================================================
   SCROLL
===================================================== */

function scrollTopPage() {

  window.scrollTo({

    top:
      0,

    behavior:
      "smooth"

  });

}


function scrollBottomPage() {

  window.scrollTo({

    top:
      document.body.scrollHeight,

    behavior:
      "smooth"

  });

}
