<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PochoJii AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f7f5ff;
      --sidebar: #ffffff;
      --card: #ffffff;
      --text: #22202b;
      --muted: #777382;
      --border: #e8e3f5;
      --primary: #7357ff;
      --primary-dark: #5b40df;
      --bubble-ai: #eeeaff;
      --input: #ffffff;
    }

    body.dark {
      --bg: #111019;
      --sidebar: #181620;
      --card: #1d1a27;
      --text: #f4f1ff;
      --muted: #aaa5b8;
      --border: #302b3c;
      --primary: #8a70ff;
      --primary-dark: #7357ff;
      --bubble-ai: #292535;
      --input: #1d1a27;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      transition: background 0.25s, color 0.25s;
    }

    button,
    textarea,
    input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* APP */

    .app {
      display: flex;
      height: 100vh;
    }

    /* SIDEBAR */

    .sidebar {
      width: 270px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      padding: 18px;
      display: flex;
      flex-direction: column;
      transition: 0.25s;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
    }

    .brand-name {
      font-size: 19px;
      font-weight: 800;
    }

    .brand-name span {
      color: var(--primary);
    }

    .new-chat {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 13px;
      background: var(--primary);
      color: white;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .new-chat:hover {
      background: var(--primary-dark);
    }

    .search-box {
      margin-bottom: 15px;
    }

    .search-box input {
      width: 100%;
      padding: 11px 13px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      outline: none;
    }

    .history-title {
      color: var(--muted);
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      margin: 5px 4px 10px;
    }

    .history {
      flex: 1;
      overflow-y: auto;
    }

    .history-item {
      padding: 11px;
      border-radius: 10px;
      margin-bottom: 5px;
      cursor: pointer;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item:hover {
      background: var(--bubble-ai);
    }

    .sidebar-bottom {
      border-top: 1px solid var(--border);
      padding-top: 13px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sidebar-btn {
      border: none;
      background: transparent;
      color: var(--text);
      text-align: left;
      padding: 10px;
      border-radius: 10px;
      font-size: 14px;
    }

    .sidebar-btn:hover {
      background: var(--bubble-ai);
    }

    /* MAIN */

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* TOP BAR */

    .topbar {
      height: 70px;
      padding: 0 25px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .mobile-menu {
      display: none;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 22px;
    }

    .top-title {
      font-weight: bold;
      font-size: 16px;
    }

    .top-subtitle {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .theme-btn {
      border: none;
      background: var(--bubble-ai);
      border-radius: 10px;
      width: 40px;
      height: 40px;
      font-size: 18px;
    }

    /* CHAT */

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 35px 20px 30px;
    }

    .chat-content {
      width: 100%;
      max-width: 850px;
      margin: auto;
    }

    /* WELCOME */

    .welcome {
      text-align: center;
      padding: 60px 15px 35px;
    }

    .welcome-logo {
      width: 82px;
      height: 82px;
      margin: auto auto 20px;
      border-radius: 26px;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 45px;
      box-shadow: 0 12px 30px rgba(115, 87, 255, 0.25);
    }

    .welcome h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .welcome h1 span {
      color: var(--primary);
    }

    .tagline {
      color: var(--muted);
      font-size: 18px;
      margin-bottom: 28px;
    }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      max-width: 650px;
      margin: auto;
    }

    .suggestion {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 14px;
      border-radius: 13px;
      text-align: left;
      transition: 0.2s;
    }

    .suggestion:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .suggestion-title {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .suggestion-text {
      color: var(--muted);
      font-size: 12px;
    }

    /* MESSAGES */

    .message {
      display: flex;
      margin-bottom: 25px;
      gap: 12px;
      align-items: flex-start;
    }

    .message.user {
      justify-content: flex-end;
    }

    .avatar {
      width: 36px;
      height: 36px;
      min-width: 36px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .ai-avatar {
      background: var(--bubble-ai);
    }

    .user-avatar {
      background: var(--primary);
      color: white;
    }

    .message-content {
      max-width: 78%;
    }

    .message-name {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 5px;
      font-weight: bold;
    }

    .bubble {
      padding: 13px 16px;
      border-radius: 17px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 15px;
    }

    .ai-bubble {
      background: var(--bubble-ai);
      border-bottom-left-radius: 5px;
    }

    .user-bubble {
      background: var(--primary);
      color: white;
      border-bottom-right-radius: 5px;
    }

    .message-actions {
      margin-top: 5px;
      display: flex;
      gap: 5px;
    }

    .copy-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      padding: 4px;
    }

    .copy-btn:hover {
      color: var(--primary);
    }

    /* TYPING */

    .typing-dots {
      display: flex;
      gap: 5px;
      padding: 4px 0;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: var(--primary);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes bounce {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.5;
      }

      30% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }

    /* INPUT */

    .input-wrapper {
      padding: 15px 20px 20px;
      background: var(--bg);
    }

    .input-container {
      max-width: 850px;
      margin: auto;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 8px;
      display: flex;
      align-items: flex-end;
      box-shadow: 0 5px 25px rgba(50, 30, 100, 0.08);
    }

    #questionInput {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      resize: none;
      padding: 11px 12px;
      min-height: 45px;
      max-height: 150px;
      font-size: 15px;
    }

    #questionInput::placeholder {
      color: var(--muted);
    }

    #sendBtn {
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 13px;
      background: var(--primary);
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    #sendBtn:hover {
      background: var(--primary-dark);
    }

    #sendBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .input-note {
      max-width: 850px;
      margin: 8px auto 0;
      text-align: center;
      color: var(--muted);
      font-size: 10px;
    }

    /* MOBILE */

    @media (max-width: 750px) {

      .sidebar {
        position: fixed;
        left: -280px;
        top: 0;
        bottom: 0;
        z-index: 1000;
        box-shadow: 5px 0 30px rgba(0, 0, 0, 0.15);
      }

      .sidebar.open {
        left: 0;
      }

      .mobile-menu {
        display: block;
        margin-right: 12px;
      }

      .topbar {
        padding: 0 15px;
      }

      .top-left {
        display: flex;
        align-items: center;
      }

      .welcome {
        padding-top: 35px;
      }

      .welcome h1 {
        font-size: 31px;
      }

      .suggestions {
        grid-template-columns: 1fr;
      }

      .message-content {
        max-width: 86%;
      }

      .chat-area {
        padding: 20px 12px;
      }

      .input-wrapper {
        padding: 10px 10px 13px;
      }
    }

    @media (max-width: 420px) {

      .welcome-logo {
        width: 68px;
        height: 68px;
        font-size: 36px;
      }

      .welcome h1 {
        font-size: 28px;
      }

      .tagline {
        font-size: 16px;
      }

      .bubble {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="brand-logo">🤖</div>

      <div class="brand-name">
        PochoJii <span>AI</span>
      </div>
    </div>

    <button class="new-chat" onclick="newChat()">
      ＋ New Chat
    </button>

    <div class="search-box">
      <input
        id="searchInput"
        type="text"
        placeholder="🔍 Search chats..."
        oninput="searchChats()"
      >
    </div>

    <div class="history-title">
      Recent Chats
    </div>

    <div class="history" id="history"></div>

    <div class="sidebar-bottom">

      <button class="sidebar-btn" onclick="toggleDarkMode()">
        🌙 Dark Mode
      </button>

      <button class="sidebar-btn" onclick="clearAllChats()">
        🗑️ Clear Chat History
      </button>

    </div>

  </aside>


  <!-- MAIN -->

  <main class="main">

    <!-- TOPBAR -->

    <header class="topbar">

      <div class="top-left">

        <button
          class="mobile-menu"
          onclick="toggleSidebar()"
        >
          ☰
        </button>

        <div>
          <div class="top-title">
            PochoJii AI
          </div>

          <div class="top-subtitle">
            Poch jo poochna hai. 💜
          </div>
        </div>

      </div>


      <button
        class="theme-btn"
        onclick="toggleDarkMode()"
        id="themeBtn"
      >
        🌙
      </button>

    </header>


    <!-- CHAT AREA -->

    <section class="chat-area" id="chatArea">

      <div class="chat-content" id="chatContent">

        <!-- WELCOME -->

        <div class="welcome" id="welcome">

          <div class="welcome-logo">
            🤖
          </div>

          <h1>
            Hey, I'm <span>PochoJii</span>!
          </h1>

          <p class="tagline">
            Poch jo poochna hai. 😎
          </p>


          <div class="suggestions">

            <button
              class="suggestion"
              onclick="useSuggestion('Explain something interesting to me')"
            >
              <div class="suggestion-title">
                🧠 Teach me something
              </div>

              <div class="suggestion-text">
                Explain something interesting
              </div>
            </button>


            <button
              class="suggestion"
              onclick="useSuggestion('Give me a cool Python project idea')"
            >
              <div class="suggestion-title">
                💻 Help me code
              </div>

              <div class="suggestion-text">
                Get programming help
              </div>
            </button>


            <button
              class="suggestion"
              onclick="useSuggestion('Give me 5 creative ideas for a project')"
            >
              <div class="suggestion-title">
                💡 Give me ideas
              </div>

              <div class="suggestion-text">
                Brainstorm something cool
              </div>
            </button>


            <button
              class="suggestion"
              onclick="useSuggestion('Tell me a surprising fact')"
            >
              <div class="suggestion-title">
                🌎 Surprise me
              </div>

              <div class="suggestion-text">
                Tell me something interesting
              </div>
            </button>

          </div>

        </div>

      </div>

    </section>


    <!-- INPUT -->

    <div class="input-wrapper">

      <div class="input-container">

        <textarea
          id="questionInput"
          rows="1"
          placeholder="Poch jo poochna hai..."
        ></textarea>

        <button
          id="sendBtn"
          onclick="askAI()"
          title="Send"
        >
          ➤
        </button>

      </div>

      <div class="input-note">
        PochoJii AI can make mistakes. Check important information.
      </div>

    </div>

  </main>

</div>


<script>

  /* =========================================
     CONFIGURATION
  ========================================= */

  const API_URL =
    "https://studybuddy-backend-kappa.vercel.app/api/chat";


  /* =========================================
     ELEMENTS
  ========================================= */

  const input =
    document.getElementById("questionInput");

  const sendBtn =
    document.getElementById("sendBtn");

  const chatContent =
    document.getElementById("chatContent");

  const chatArea =
    document.getElementById("chatArea");

  const welcome =
    document.getElementById("welcome");

  const history =
    document.getElementById("history");

  const searchInput =
    document.getElementById("searchInput");


  /* =========================================
     CHAT DATA
  ========================================= */

  let chats =
    JSON.parse(
      localStorage.getItem("pochojii_chats") || "[]"
    );

  let currentChat = null;


  /* =========================================
     START NEW CHAT
  ========================================= */

  function newChat() {

    currentChat = {
      id: Date.now(),
      title: "New Chat",
      messages: []
    };

    renderChat();

    input.focus();

    closeSidebar();

  }


  /* =========================================
     RENDER CHAT
  ========================================= */

  function renderChat() {

    chatContent.innerHTML = "";

    if (
      !currentChat ||
      currentChat.messages.length === 0
    ) {

      showWelcome();

      return;

    }


    currentChat.messages.forEach(message => {

      addMessageToScreen(
        message.text,
        message.type,
        false
      );

    });

    scrollToBottom();

  }


  /* =========================================
     WELCOME SCREEN
  ========================================= */

  function showWelcome() {

    chatContent.innerHTML = `

      <div class="welcome" id="welcome">

        <div class="welcome-logo">
          🤖
        </div>

        <h1>
          Hey, I'm <span>PochoJii</span>!
        </h1>

        <p class="tagline">
          Poch jo poochna hai. 😎
        </p>

        <div class="suggestions">

          <button
            class="suggestion"
            onclick="useSuggestion('Explain something interesting to me')"
          >
            <div class="suggestion-title">
              🧠 Teach me something
            </div>

            <div class="suggestion-text">
              Explain something interesting
            </div>
          </button>

          <button
            class="suggestion"
            onclick="useSuggestion('Give me a cool Python project idea')"
          >
            <div class="suggestion-title">
              💻 Help me code
            </div>

            <div class="suggestion-text">
              Get programming help
            </div>
          </button>

          <button
            class="suggestion"
            onclick="useSuggestion('Give me 5 creative ideas for a project')"
          >
            <div class="suggestion-title">
              💡 Give me ideas
            </div>

            <div class="suggestion-text">
              Brainstorm something cool
            </div>
          </button>

          <button
            class="suggestion"
            onclick="useSuggestion('Tell me a surprising fact')"
          >
            <div class="suggestion-title">
              🌎 Surprise me
            </div>

            <div class="suggestion-text">
              Tell me something interesting
            </div>
          </button>

        </div>

      </div>

    `;

  }


  /* =========================================
     ADD MESSAGE
  ========================================= */

  function addMessageToScreen(
    text,
    type,
    save = true
  ) {

    const message =
      document.createElement("div");

    message.className =
      "message " + type;


    const avatar =
      document.createElement("div");

    avatar.className =
      "avatar " +
      (type === "ai"
        ? "ai-avatar"
        : "user-avatar");

    avatar.textContent =
      type === "ai"
        ? "🤖"
        : "👤";


    const content =
      document.createElement("div");

    content.className =
      "message-content";


    const name =
      document.createElement("div");

    name.className =
      "message-name";

    name.textContent =
      type === "ai"
        ? "PochoJii AI"
        : "You";


    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble " +
      (type === "ai"
        ? "ai-bubble"
        : "user-bubble");

    bubble.textContent = text;


    content.appendChild(name);

    content.appendChild(bubble);


    /* COPY BUTTON */

    if (type === "ai") {

      const actions =
        document.createElement("div");

      actions.className =
        "message-actions";


      const copy =
        document.createElement("button");

      copy.className =
        "copy-btn";

      copy.textContent =
        "📋 Copy";

      copy.onclick = function() {

        navigator.clipboard
          .writeText(text)
          .then(() => {

            copy.textContent =
              "✅ Copied!";

            setTimeout(() => {

              copy.textContent =
                "📋 Copy";

            }, 1500);

          });

      };


      actions.appendChild(copy);

      content.appendChild(actions);

    }


    if (type === "user") {

      message.appendChild(content);

      message.appendChild(avatar);

    } else {

      message.appendChild(avatar);

      message.appendChild(content);

    }


    chatContent.appendChild(message);


    if (save && currentChat) {

      currentChat.messages.push({
        text: text,
        type: type
      });

      saveCurrentChat();

    }


    scrollToBottom();

  }


  /* =========================================
     ASK AI
  ========================================= */

  async function askAI() {

    const question =
      input.value.trim();


    if (!question) {
      return;
    }


    /* Create chat if needed */

    if (!currentChat) {

      currentChat = {
        id: Date.now(),
        title: question.substring(0, 35),
        messages: []
      };

    }


    /* Set title */

    if (
      currentChat.messages.length === 0
    ) {

      currentChat.title =
        question.substring(0, 35);

    }


    /* Show user message */

    addMessageToScreen(
      question,
      "user"
    );


    input.value = "";

    autoResize();


    sendBtn.disabled = true;

    sendBtn.textContent = "⏳";


    /* Typing */

    const typing =
      document.createElement("div");

    typing.className =
      "message ai";

    typing.id =
      "typing";


    typing.innerHTML = `

      <div class="avatar ai-avatar">
        🤖
      </div>

      <div class="message-content">

        <div class="message-name">
          PochoJii AI
        </div>

        <div class="bubble ai-bubble">

          <div class="typing-dots">

            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>

          </div>

        </div>

      </div>

    `;


    chatContent.appendChild(typing);

    scrollToBottom();


    try {

      const response =
        await fetch(API_URL, {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            question: question
          })

        });


      const data =
        await response.json();


      const typingElement =
        document.getElementById("typing");

      if (typingElement) {
        typingElement.remove();
      }


      if (!response.ok) {

        addMessageToScreen(
          "Oops 😭 " +
          (data.error ||
            "Something went wrong."),
          "ai"
        );

        return;

      }


      const answer =
        data.answer ||
        "I couldn't generate an answer.";


      addMessageToScreen(
        answer,
        "ai"
      );


    } catch (error) {

      const typingElement =
        document.getElementById("typing");

      if (typingElement) {
        typingElement.remove();
      }


      addMessageToScreen(
        "Oops 😭 I couldn't connect to PochoJii right now. Please try again.",
        "ai"
      );


      console.error(error);

    } finally {

      sendBtn.disabled = false;

      sendBtn.textContent = "➤";

      input.focus();

      saveCurrentChat();

      renderHistory();

    }

  }


  /* =========================================
     SAVE CHAT
  ========================================= */

  function saveCurrentChat() {

    if (!currentChat) {
      return;
    }


    const index =
      chats.findIndex(
        chat => chat.id === currentChat.id
      );


    if (index === -1) {

      chats.unshift(currentChat);

    } else {

      chats[index] =
        currentChat;

    }


    localStorage.setItem(
      "pochojii_chats",
      JSON.stringify(chats)
    );


    renderHistory();

  }


  /* =========================================
     HISTORY
  ========================================= */

  function renderHistory(
    filtered = chats
  ) {

    history.innerHTML = "";


    if (filtered.length === 0) {

      history.innerHTML = `

        <div style="
          color: var(--muted);
          font-size: 12px;
          padding: 10px;
        ">
          No chats yet.
        </div>

      `;

      return;

    }


    filtered.forEach(chat => {

      const item =
        document.createElement("div");

      item.className =
        "history-item";

      item.textContent =
        "💬 " +
        (chat.title || "New Chat");


      item.onclick = function() {

        loadChat(chat.id);

      };


      history.appendChild(item);

    });

  }


  /* =========================================
     LOAD CHAT
  ========================================= */

  function loadChat(id) {

    const chat =
      chats.find(
        item => item.id === id
      );


    if (!chat) {
      return;
    }


    currentChat = chat;

    renderChat();

    closeSidebar();

  }


  /* =========================================
     SEARCH CHATS
  ========================================= */

  function searchChats() {

    const query =
      searchInput.value
        .toLowerCase()
        .trim();


    if (!query) {

      renderHistory(chats);

      return;

    }


    const filtered =
      chats.filter(chat =>
        (chat.title || "")
          .toLowerCase()
          .includes(query)
      );


    renderHistory(filtered);

  }


  /* =========================================
     CLEAR ALL CHATS
  ========================================= */

  function clearAllChats() {

    if (chats.length === 0) {
      return;
    }


    const confirmed =
      confirm(
        "Delete all saved chats?"
      );


    if (!confirmed) {
      return;
    }


    chats = [];

    currentChat = null;


    localStorage.removeItem(
      "pochojii_chats"
    );


    renderHistory();

    renderChat();

  }


  /* =========================================
     SUGGESTION
  ========================================= */

  function useSuggestion(text) {

    input.value = text;

    autoResize();

    input.focus();

    askAI();

  }


  /* =========================================
     DARK MODE
  ========================================= */

  function toggleDarkMode() {

    document.body.classList.toggle("dark");


    const dark =
      document.body.classList.contains("dark");


    localStorage.setItem(
      "pochojii_dark",
      dark
    );


    updateThemeIcon();

  }


  function updateThemeIcon() {

    const dark =
      document.body.classList.contains("dark");


    document.getElementById(
      "themeBtn"
    ).textContent =
      dark ? "☀️" : "🌙";

  }


  /* =========================================
     MOBILE SIDEBAR
  ========================================= */

  function toggleSidebar() {

    document
      .getElementById("sidebar")
      .classList.toggle("open");

  }


  function closeSidebar() {

    document
      .getElementById("sidebar")
      .classList.remove("open");

  }


  /* =========================================
     AUTO RESIZE INPUT
  ========================================= */

  function autoResize() {

    input.style.height = "auto";

    input.style.height =
      Math.min(
        input.scrollHeight,
        150
      ) + "px";

  }


  /* =========================================
     ENTER TO SEND
  ========================================= */

  input.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        askAI();

      }

    }
  );


  input.addEventListener(
    "input",
    autoResize
  );


  /* =========================================
     SCROLL
  ========================================= */

  function scrollToBottom() {

    setTimeout(() => {

      chatArea.scrollTop =
        chatArea.scrollHeight;

    }, 50);

  }


  /* =========================================
     LOAD SAVED SETTINGS
  ========================================= */

  if (
    localStorage.getItem(
      "pochojii_dark"
    ) === "true"
  ) {

    document.body.classList.add("dark");

  }


  /* =========================================
     START
  ========================================= */

  updateThemeIcon();

  renderHistory();

  newChat();

</script>

</body>
</html>
